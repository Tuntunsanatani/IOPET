  nmvn1: [
    { id: 'nmvn1_01', d: 'easy', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>राज्य, ज़िला, प्रखंड</b>', o: ['[[venn:sep3]]', '[[venn:overlap3]]', '[[venn:nest3]]', '[[venn:two_in]]'], a: 2, x: 'प्रखंड, ज़िले के अंदर है और ज़िला, राज्य के अंदर — तीनों वृत्त एक-दूसरे के अंदर: [[venn:nest3]]' },
    { id: 'nmvn1_02', d: 'easy', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>कमीज़, पैंट, कपड़े</b>', o: ['[[venn:over_in]]', '[[venn:sep3]]', '[[venn:nest3]]', '[[venn:two_in]]'], a: 3, x: 'कमीज़ और पैंट दोनों कपड़े हैं, पर कोई कमीज़ पैंट नहीं होती — कपड़ों के बड़े वृत्त के अंदर दो अलग वृत्त: [[venn:two_in]]' },
    { id: 'nmvn1_03', d: 'medium', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>मनुष्य, डॉक्टर, खिलाड़ी</b>', o: ['[[venn:over_in]]', '[[venn:nest3]]', '[[venn:two_in]]', '[[venn:nest_cross]]'], a: 0, x: 'डॉक्टर और खिलाड़ी दोनों मनुष्य हैं। कुछ डॉक्टर खिलाड़ी भी होते हैं, पर सब नहीं — इसलिए डॉक्टर और खिलाड़ी के वृत्त आपस में कटते हैं, और दोनों मनुष्य के बड़े वृत्त के अंदर हैं: [[venn:over_in]]' },
    { id: 'nmvn1_04', d: 'easy', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>यमुना, नदी, नर्मदा</b>', o: ['[[venn:in_sep]]', '[[venn:over_in]]', '[[venn:two_in]]', '[[venn:nest3]]'], a: 2, x: 'यमुना और नर्मदा दोनों नदियाँ हैं, पर एक-दूसरे से अलग — नदी के बड़े वृत्त के अंदर दो अलग वृत्त: [[venn:two_in]]' },
    { id: 'nmvn1_05', d: 'easy', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>आलू, टमाटर, प्याज़</b>', o: ['[[venn:two_in]]', '[[venn:overlap3]]', '[[venn:sep3]]', '[[venn:chain3]]'], a: 2, x: 'आलू, टमाटर और प्याज़ में से कोई भी दूसरे का भाग नहीं — तीनों अलग-अलग वृत्त: [[venn:sep3]]' },
    { id: 'nmvn1_06', d: 'easy', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>मिठाई, रसगुल्ला, सेब</b>', o: ['[[venn:sep3]]', '[[venn:in_sep]]', '[[venn:over_sep]]', '[[venn:two_in]]'], a: 1, x: 'रसगुल्ला एक मिठाई है (मिठाई के वृत्त के अंदर), पर सेब मिठाई नहीं — वह अलग वृत्त है: [[venn:in_sep]]' },
    { id: 'nmvn1_07', d: 'medium', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>पुरुष, शिक्षक, महिला</b>', o: ['[[venn:chain3]]', '[[venn:over_sep]]', '[[venn:two_in]]', '[[venn:overlap3]]'], a: 0, x: 'कुछ शिक्षक पुरुष हैं और कुछ महिलाएँ, पर कोई पुरुष महिला नहीं — शिक्षक का वृत्त दोनों को काटता है, जबकि पुरुष और महिला के वृत्त अलग हैं: [[venn:chain3]]' },
    { id: 'nmvn1_08', d: 'medium', q: 'इन तीनों का संबंध कौन-सा चित्र सबसे सही दिखाता है? <b>भारतीय, बिहारी, किसान</b>', o: ['[[venn:nest_cross]]', '[[venn:overlap3]]', '[[venn:nest3]]', '[[venn:over_in]]'], a: 0, x: 'हर बिहारी भारतीय है, तो बिहारी का वृत्त भारतीय के अंदर। किसान कुछ बिहारी हैं, कुछ दूसरे राज्यों के भारतीय और कुछ दूसरे देशों के — किसान का वृत्त दोनों को काटता है और बाहर भी जाता है: [[venn:nest_cross]]' },
    { id: 'nmvn1_09', d: 'easy', q: 'चित्र में चाय, कॉफ़ी और शीतल पेय पीने वाले लोगों की संख्या दिखाई गई है। केवल कॉफ़ी पीने वाले कितने लोग हैं? [[venn3:चाय,कॉफ़ी,शीतल पेय;25,15,20,10,8,6,5]]', o: ['8', '15', '23', '38'], a: 1, x: 'केवल कॉफ़ी वाला भाग वह है जो किसी दूसरे वृत्त में नहीं: <b>15</b>। (38 तो कॉफ़ी पीने वाले कुल लोग हैं: 15 + 10 + 8 + 5।)' },
    { id: 'nmvn1_10', d: 'medium', q: 'चित्र में चाय, कॉफ़ी और शीतल पेय पीने वाले लोगों की संख्या दिखाई गई है। कितने लोग चाय और कॉफ़ी दोनों पीते हैं, पर शीतल पेय नहीं? [[venn3:चाय,कॉफ़ी,शीतल पेय;25,15,20,10,8,6,5]]', o: ['10', '15', '21', '25'], a: 0, x: 'चाय और कॉफ़ी के वृत्तों का साझा भाग, जो शीतल पेय के वृत्त से बाहर है: <b>10</b>। (15 लेने पर तीनों पीने वाले 5 लोग भी जुड़ जाते, जबकि वे शीतल पेय भी पीते हैं।)' },
    { id: 'nmvn1_11', d: 'easy', q: 'चित्र में चाय, कॉफ़ी और शीतल पेय पीने वाले लोगों की संख्या दिखाई गई है। कितने लोग तीनों पेय पीते हैं? [[venn3:चाय,कॉफ़ी,शीतल पेय;25,15,20,10,8,6,5]]', o: ['3', '5', '6', '8'], a: 1, x: 'तीनों वृत्तों का साझा, बीच वाला भाग: <b>5</b>।' },
    { id: 'nmvn1_12', d: 'medium', q: 'चित्र में चाय, कॉफ़ी और शीतल पेय पीने वाले लोगों की संख्या दिखाई गई है। कुल कितने लोग चाय पीते हैं? [[venn3:चाय,कॉफ़ी,शीतल पेय;25,15,20,10,8,6,5]]', o: ['25', '36', '41', '46'], a: 3, x: 'चाय के वृत्त के सारे भाग जोड़ो: केवल चाय 25 + चाय-कॉफ़ी 10 + चाय-शीतल पेय 6 + तीनों 5 = <b>46</b>।' },
    { id: 'nmvn1_13', d: 'medium', q: 'चित्र में चाय, कॉफ़ी और शीतल पेय पीने वाले लोगों की संख्या दिखाई गई है। कितने लोग ठीक दो पेय पीते हैं? [[venn3:चाय,कॉफ़ी,शीतल पेय;25,15,20,10,8,6,5]]', o: ['19', '24', '29', '34'], a: 1, x: 'ठीक दो पेय = दो-दो वृत्तों के साझा भाग, तीनों वाला बीच का भाग नहीं: 10 + 8 + 6 = <b>24</b>।' },
    { id: 'nmvn1_14', d: 'medium', q: 'चित्र में तीन वृत्त खिलाड़ियों, अनुशासित लोगों और लड़कों को दिखाते हैं; हर भाग पर एक संख्या लिखी है। किस संख्या वाला भाग उन लड़कों को दिखाता है जो खिलाड़ी भी हैं और अनुशासित भी? [[venn3:खिलाड़ी,अनुशासित,लड़के;1,2,3,4,5,6,7]]', o: ['4', '5', '6', '7'], a: 3, x: 'लड़के, खिलाड़ी और अनुशासित — तीनों वृत्तों का साझा भाग: <b>7</b>।' },
    { id: 'nmvn1_15', d: 'medium', q: 'चित्र में तीन वृत्त खिलाड़ियों, अनुशासित लोगों और लड़कों को दिखाते हैं; हर भाग पर एक संख्या लिखी है। किस संख्या वाला भाग उन लड़कों को दिखाता है जो अनुशासित हैं, पर खिलाड़ी नहीं? [[venn3:खिलाड़ी,अनुशासित,लड़के;1,2,3,4,5,6,7]]', o: ['2', '4', '5', '7'], a: 2, x: 'अनुशासित और लड़कों के वृत्तों का साझा भाग, जो खिलाड़ियों के वृत्त से बाहर है: <b>5</b>। (7 में खिलाड़ी भी शामिल हैं।)' }
  ],

  /* ── NMMS Bihar · Word formation · Mark 1 (Hindi) ── */
  nmwf1: [
    { id: 'nmwf1_01', d: 'easy', q: 'शब्द <b>TEACHER</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['BEACH', 'PEACH', 'CHAIR', 'CHEAT'], a: 3, x: 'TEACHER में T, E, A, C, H, E, R हैं। <b>CHEAT</b> के सारे अक्षर इनमें हैं। CHAIR में I नहीं, PEACH में P नहीं, BEACH में B नहीं। टिप: हर विकल्प के अक्षर एक-एक करके दिए गए शब्द में ढूँढो — और दोहराए गए अक्षर गिनना मत भूलो।' },
    { id: 'nmwf1_02', d: 'easy', q: 'शब्द <b>TRANSFORM</b> के अक्षरों से इनमें से कौन-सा शब्द नहीं बन सकता? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['MASTER', 'FARM', 'SORT', 'STORM'], a: 0, x: 'TRANSFORM में E नहीं है, इसलिए <b>MASTER</b> नहीं बन सकता। STORM, FARM और SORT के सारे अक्षर TRANSFORM में हैं।' },
    { id: 'nmwf1_03', d: 'medium', q: 'शब्द <b>AUTONOMOUS</b> के अक्षरों से इनमें से कौन-सा शब्द नहीं बन सकता? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['AUTO', 'NATIONS', 'MOUNT', 'MOON'], a: 1, x: 'AUTONOMOUS में I नहीं है, इसलिए <b>NATIONS</b> नहीं बन सकता। MOON के दो O भी मिल जाते हैं (AUTONOMOUS में तीन O हैं)।' },
    { id: 'nmwf1_04', d: 'medium', q: 'शब्द <b>CONSTRUCTION</b> के अक्षरों से इनमें से कौन-सा शब्द नहीं बन सकता? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['COTTON', 'UNION', 'INSTRUCT', 'COUNTRY'], a: 3, x: 'CONSTRUCTION में Y नहीं है, इसलिए <b>COUNTRY</b> नहीं बन सकता। INSTRUCT के दो T, COTTON के दो T और दो O, और UNION के दो N — सब CONSTRUCTION में मिल जाते हैं।' },
    { id: 'nmwf1_05', d: 'easy', q: 'शब्द <b>HONESTY</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['TOWNS', 'HONEY', 'MONEY', 'HOUSE'], a: 1, x: 'HONESTY में H, O, N, E, S, T, Y हैं। <b>HONEY</b> बन जाता है। MONEY में M नहीं, HOUSE में U नहीं, TOWNS में W नहीं।' },
    { id: 'nmwf1_06', d: 'medium', q: 'शब्द <b>EXAMINATION</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['ANIMATION', 'EXAMINER', 'NATIVE', 'NATIONAL'], a: 0, x: 'EXAMINATION में दो A, दो I, दो N हैं। <b>ANIMATION</b> को भी इतने ही चाहिए — बन जाता है। EXAMINER को दो E चाहिए (एक ही है), NATIONAL में L नहीं, NATIVE में V नहीं।' },
    { id: 'nmwf1_07', d: 'medium', q: 'शब्द <b>INFORMATION</b> के अक्षरों से इनमें से कौन-सा शब्द नहीं बन सकता? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['NATION', 'FORMAT', 'MOTION', 'FARMER'], a: 3, x: 'INFORMATION में E नहीं है, इसलिए <b>FARMER</b> नहीं बन सकता (उसमें R भी दो चाहिए, जबकि एक ही है)। MOTION, FORMAT और NATION बन जाते हैं।' },
    { id: 'nmwf1_08', d: 'easy', q: 'अक्षरों <b>RSARTIAM</b> को सही क्रम में लगाने पर एक भारतीय शहर का नाम बनता है। वह शहर कौन-सा है?', o: ['AHMEDABAD', 'AMRITSAR', 'SRINAGAR', 'MEERUT'], a: 1, x: 'RSARTIAM के आठ अक्षर — A, A, M, R, R, I, T, S — मिलकर <b>AMRITSAR</b> बनाते हैं। बाकी नामों के अक्षर अलग हैं (जैसे AHMEDABAD में D, MEERUT में E)।' },
    { id: 'nmwf1_09', d: 'easy', q: 'अक्षरों <b>UNPKIPM</b> को सही क्रम में लगाने पर एक सब्ज़ी का नाम बनता है। वह सब्ज़ी कौन-सी है?', o: ['SPINACH', 'POTATO', 'PUMPKIN', 'CABBAGE'], a: 2, x: 'U, N, P, K, I, P, M — इनसे <b>PUMPKIN</b> (कद्दू) बनता है। ठीक इन्हीं सात अक्षरों से बना यही एक नाम है।' },
    { id: 'nmwf1_10', d: 'easy', q: 'अक्षरों <b>RROCTA</b> को सही क्रम में लगाने पर एक सब्ज़ी का नाम बनता है। वह सब्ज़ी कौन-सी है?', o: ['TOMATO', 'POTATO', 'CARROT', 'RADISH'], a: 2, x: 'R, R, O, C, T, A — इनसे <b>CARROT</b> (गाजर) बनता है। बाकी नामों में ऐसे अक्षर हैं जो यहाँ नहीं हैं।' },
    { id: 'nmwf1_11', d: 'medium', q: 'शब्द <b>PRINTER</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['PRINCE', 'PAINTER', 'POINTER', 'TRIP'], a: 3, x: 'PRINTER में P, R, I, N, T, E, R हैं। <b>TRIP</b> बन जाता है। PAINTER में A नहीं, POINTER में O नहीं, PRINCE में C नहीं।' },
    { id: 'nmwf1_12', d: 'medium', q: 'शब्द <b>STRUCTURES</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['TRUTH', 'SECURE', 'TREES', 'RESTS'], a: 3, x: 'STRUCTURES में S दो बार और E एक बार है। <b>RESTS</b> (दो S, एक E) बन जाता है। TREES और SECURE को दो E चाहिए, और TRUTH में H नहीं।' },
    { id: 'nmwf1_13', d: 'medium', q: 'शब्द <b>MEASUREMENT</b> के अक्षरों से इनमें से कौन-सा शब्द नहीं बन सकता? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['MEANT', 'MASTER', 'SUMMIT', 'NATURE'], a: 2, x: 'MEASUREMENT में I नहीं है, इसलिए <b>SUMMIT</b> नहीं बन सकता। MASTER, NATURE और MEANT के सारे अक्षर उसमें हैं।' },
    { id: 'nmwf1_14', d: 'easy', q: 'शब्द <b>SCHOOL</b> के अक्षरों से इनमें से कौन-सा शब्द बन सकता है? (हर अक्षर उतनी ही बार प्रयोग हो सकता है, जितनी बार वह दिए गए शब्द में है।)', o: ['COOL', 'SHOOT', 'CLASS', 'SHOE'], a: 0, x: 'SCHOOL में S, C, H, O, O, L हैं। <b>COOL</b> (दो O) बन जाता है। SHOE में E नहीं, CLASS में A नहीं, SHOOT में T नहीं।' },

  /* ── NMMS Bihar · Statements and conclusions · Mark 1 (Hindi) ── */
  nmsc1: [
    { id: 'nmsc1_01', d: 'easy', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी केले फल हैं। सभी फल मीठे हैं। <b>निष्कर्ष:</b> I. सभी केले मीठे हैं। II. कुछ मीठी चीज़ें केले हैं।', o: ['न I निकलता है, न II', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'केवल निष्कर्ष I निकलता है'], a: 1, x: 'केले फलों के अंदर हैं और फल मीठी चीज़ों के अंदर, तो सभी केले मीठे हैं (I)। और केले मीठी चीज़ों में शामिल हैं, इसलिए कुछ मीठी चीज़ें केले हैं (II)। <b>दोनों</b> निकलते हैं। टिप: “सभी A, B हैं” से “कुछ B, A हैं” हमेशा निकलता है।' },
    { id: 'nmsc1_02', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कुछ अभिनेता गायक हैं। सभी गायक नर्तक हैं। <b>निष्कर्ष:</b> I. कुछ अभिनेता नर्तक हैं। II. सभी नर्तक गायक हैं।', o: ['I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है', 'केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II'], a: 1, x: 'जो अभिनेता गायक हैं, वे सब नर्तक भी हैं — इसलिए कुछ अभिनेता नर्तक हैं (I निकलता है)। “सभी गायक नर्तक हैं” को उलटकर “सभी नर्तक गायक हैं” नहीं कह सकते (II नहीं)। <b>केवल I</b>।' },
    { id: 'nmsc1_03', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कुछ कागज़ कलम हैं। कुछ कलम पेंसिल हैं। <b>निष्कर्ष:</b> I. कुछ कागज़ पेंसिल हैं। II. कुछ पेंसिल कलम हैं।', o: ['I और II दोनों निकलते हैं', 'न I निकलता है, न II', 'केवल निष्कर्ष II निकलता है', 'केवल निष्कर्ष I निकलता है'], a: 2, x: '“कुछ” और “कुछ” से दोनों छोरों का पक्का संबंध नहीं बनता — जो कलम पेंसिल हैं, ज़रूरी नहीं कि वे कागज़ भी हों (I नहीं)। “कुछ कलम पेंसिल हैं” को उलटकर “कुछ पेंसिल कलम हैं” कह सकते हैं (II)। <b>केवल II</b>।' },
    { id: 'nmsc1_04', d: 'easy', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी हारमोनियम वाद्य यंत्र हैं। कोई भी वाद्य यंत्र मेज़ नहीं है। <b>निष्कर्ष:</b> I. कोई भी हारमोनियम मेज़ नहीं है। II. कुछ वाद्य यंत्र हारमोनियम हैं।', o: ['न I निकलता है, न II', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'केवल निष्कर्ष I निकलता है'], a: 1, x: 'हारमोनियम वाद्य यंत्रों के अंदर हैं, और वाद्य यंत्रों का मेज़ से कोई मेल नहीं — तो कोई हारमोनियम मेज़ नहीं (I)। “सभी हारमोनियम वाद्य यंत्र हैं” से “कुछ वाद्य यंत्र हारमोनियम हैं” (II)। <b>दोनों</b>।' },
    { id: 'nmsc1_05', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कुछ नींबू पीले हैं। कुछ पीली चीज़ें मीठी हैं। <b>निष्कर्ष:</b> I. कुछ नींबू मीठे हैं। II. सभी पीली चीज़ें नींबू हैं।', o: ['I और II दोनों निकलते हैं', 'न I निकलता है, न II', 'केवल निष्कर्ष I निकलता है', 'केवल निष्कर्ष II निकलता है'], a: 1, x: '“कुछ” और “कुछ” से पक्का निष्कर्ष नहीं निकलता: मीठी पीली चीज़ें नींबू के अलावा भी हो सकती हैं (I नहीं)। “कुछ नींबू पीले हैं” से यह नहीं कहा जा सकता कि सारी पीली चीज़ें नींबू हैं (II नहीं)। <b>कोई नहीं</b>।' },
    { id: 'nmsc1_06', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी डॉक्टर पढ़े-लिखे हैं। कुछ पढ़े-लिखे लोग खिलाड़ी हैं। <b>निष्कर्ष:</b> I. कुछ डॉक्टर खिलाड़ी हैं। II. कुछ पढ़े-लिखे लोग डॉक्टर हैं।', o: ['I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II', 'केवल निष्कर्ष I निकलता है'], a: 1, x: 'जो पढ़े-लिखे लोग खिलाड़ी हैं, वे डॉक्टरों से अलग भी हो सकते हैं (I पक्का नहीं)। पर सभी डॉक्टर पढ़े-लिखे हैं, इसलिए कुछ पढ़े-लिखे लोग डॉक्टर हैं (II)। <b>केवल II</b>।' },
    { id: 'nmsc1_07', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कोई भी बिल्ली कुत्ता नहीं है। सभी कुत्ते जानवर हैं। <b>निष्कर्ष:</b> I. कोई भी बिल्ली जानवर नहीं है। II. कुछ जानवर कुत्ते हैं।', o: ['I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है', 'केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II'], a: 2, x: 'बिल्ली कुत्ता नहीं है, पर इससे यह नहीं निकलता कि बिल्ली जानवर नहीं (I नहीं)। सभी कुत्ते जानवर हैं, तो कुछ जानवर कुत्ते हैं (II)। <b>केवल II</b>।' },
    { id: 'nmsc1_08', d: 'easy', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी गुलाब फूल हैं। कुछ फूल लाल हैं। <b>निष्कर्ष:</b> I. कुछ गुलाब लाल हैं। II. सभी गुलाब लाल हैं।', o: ['केवल निष्कर्ष I निकलता है', 'केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II', 'I और II दोनों निकलते हैं'], a: 2, x: 'लाल फूल गुलाब के अलावा भी हो सकते हैं, इसलिए गुलाबों के लाल होने के बारे में कुछ भी पक्का नहीं (न I, न II)। <b>कोई नहीं</b>।' },
    { id: 'nmsc1_09', d: 'easy', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी लड़के खिलाड़ी हैं। कोई भी खिलाड़ी आलसी नहीं है। <b>निष्कर्ष:</b> I. कोई भी लड़का आलसी नहीं है। II. सभी खिलाड़ी लड़के हैं।', o: ['I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है', 'न I निकलता है, न II', 'केवल निष्कर्ष II निकलता है'], a: 1, x: 'लड़के खिलाड़ियों के अंदर हैं और कोई खिलाड़ी आलसी नहीं — तो कोई लड़का आलसी नहीं (I)। “सभी लड़के खिलाड़ी हैं” को उलटा नहीं कर सकते (II नहीं)। <b>केवल I</b>।' },
    { id: 'nmsc1_10', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कुछ किताबें पेन हैं। कोई भी पेन घड़ी नहीं है। <b>निष्कर्ष:</b> I. कुछ किताबें घड़ी नहीं हैं। II. कोई भी किताब घड़ी नहीं है।', o: ['I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'केवल निष्कर्ष I निकलता है', 'न I निकलता है, न II'], a: 2, x: 'जो किताबें पेन हैं, वे घड़ी नहीं हो सकतीं — इसलिए कुछ किताबें घड़ी नहीं हैं (I)। बाकी किताबों के बारे में कुछ नहीं कहा गया, तो “कोई भी किताब घड़ी नहीं” पक्का नहीं (II नहीं)। <b>केवल I</b>।' },
    { id: 'nmsc1_11', d: 'easy', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> सभी बच्चे विद्यार्थी हैं। सभी विद्यार्थी खिलाड़ी हैं। <b>निष्कर्ष:</b> I. सभी बच्चे खिलाड़ी हैं। II. सभी खिलाड़ी बच्चे हैं।', o: ['केवल निष्कर्ष I निकलता है', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II'], a: 0, x: 'बच्चे विद्यार्थियों के अंदर, और विद्यार्थी खिलाड़ियों के अंदर — तो सभी बच्चे खिलाड़ी हैं (I)। उल्टा “सभी खिलाड़ी बच्चे हैं” नहीं निकलता (II नहीं)। <b>केवल I</b>।' },
    { id: 'nmsc1_12', d: 'medium', q: 'कथनों को सत्य मानते हुए (चाहे वे सामान्य ज्ञान से अलग लगें) बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कुछ पेड़ फूल हैं। कुछ फूल फल हैं। <b>निष्कर्ष:</b> I. कुछ पेड़ फल हैं। II. सभी फल पेड़ हैं।', o: ['केवल निष्कर्ष II निकलता है', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है', 'न I निकलता है, न II'], a: 3, x: '“कुछ” और “कुछ” से पक्का निष्कर्ष नहीं निकलता (I नहीं), और फलों के सारे पेड़ होने की बात तो कहीं से नहीं आती (II नहीं)। <b>कोई नहीं</b>।' },
    { id: 'nmsc1_13', d: 'easy', q: 'कथन को सत्य मानते हुए बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> कक्षा 8 के सभी विद्यार्थियों को वर्दी पहनकर आना है। <b>निष्कर्ष:</b> I. राम को, जो कक्षा 8 में पढ़ता है, वर्दी पहनकर आना है। II. दूसरी कक्षाओं के विद्यार्थियों के लिए वर्दी पहनकर आना ज़रूरी नहीं है।', o: ['न I निकलता है, न II', 'केवल निष्कर्ष II निकलता है', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है'], a: 3, x: 'नियम कक्षा 8 के सभी विद्यार्थियों पर है, और राम कक्षा 8 में है — I निकलता है। दूसरी कक्षाओं के बारे में कथन कुछ नहीं कहता — II नहीं निकलता। <b>केवल I</b>।' },
    { id: 'nmsc1_14', d: 'medium', q: 'कथन को सत्य मानते हुए बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> इस विद्यालय के सभी शिक्षक स्नातक हैं। <b>निष्कर्ष:</b> I. मोहन, जो इस विद्यालय में शिक्षक है, स्नातक है। II. सोहन, जो स्नातक नहीं है, इस विद्यालय में शिक्षक नहीं है।', o: ['केवल निष्कर्ष II निकलता है', 'न I निकलता है, न II', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष I निकलता है'], a: 2, x: 'मोहन यहाँ शिक्षक है, तो स्नातक है (I)। सोहन स्नातक नहीं है; यदि वह यहाँ शिक्षक होता, तो स्नातक होता — इसलिए वह यहाँ शिक्षक नहीं (II)। <b>दोनों</b>।' },
    { id: 'nmsc1_15', d: 'medium', q: 'कथन को सत्य मानते हुए बताइए कि कौन-सा निष्कर्ष निश्चित रूप से निकलता है। <b>कथन:</b> रविवार को सभी सरकारी दफ़्तर बंद रहते हैं। <b>निष्कर्ष:</b> I. सोमवार को सभी सरकारी दफ़्तर खुले रहते हैं। II. डाकघर, जो एक सरकारी दफ़्तर है, रविवार को बंद रहता है।', o: ['न I निकलता है, न II', 'I और II दोनों निकलते हैं', 'केवल निष्कर्ष II निकलता है', 'केवल निष्कर्ष I निकलता है'], a: 2, x: 'कथन केवल रविवार की बात करता है; सोमवार के बारे में कुछ नहीं कहता (I नहीं)। डाकघर एक सरकारी दफ़्तर है, तो रविवार को बंद रहेगा (II)। <b>केवल II</b>।' }
  ],

  /* ── NMMS Bihar · Seating arrangement · Mark 1 (Hindi) ── */
  nmst1: [
    { id: 'nmst1_01', d: 'easy', q: 'पाँच दोस्त A, B, C, D, E एक पंक्ति में उत्तर की ओर मुँह करके बैठे हैं। A सबसे बाएँ है। B, A के ठीक दाएँ है। C सबसे दाएँ है। D, C के ठीक बाएँ है। बीच में कौन बैठा है?', o: ['A', 'E', 'D', 'B'], a: 1, x: 'बाएँ से: A, B, _, D, C। बची जगह बीच में है, और बचा व्यक्ति E — इसलिए बीच में <b>E</b>। टिप: पहले पक्की जगहें (सबसे बाएँ, सबसे दाएँ, बीच) भरो, फिर “ठीक बाएँ / ठीक दाएँ” वाले जोड़े।' },
    { id: 'nmst1_02', d: 'easy', q: 'छह लड़के P, Q, R, S, T, U एक पंक्ति में उत्तर की ओर मुँह करके खड़े हैं। P सबसे बाएँ और S सबसे दाएँ है। U, P के ठीक दाएँ है। Q, R के ठीक बाएँ है और T, R के ठीक दाएँ। R और S के बीच कौन है?', o: ['U', 'T', 'Q', 'P'], a: 1, x: 'बाएँ से: P, U, फिर Q-R-T एक साथ, और अंत में S — P, U, Q, R, T, S। R और S के बीच <b>T</b> है।' },
    { id: 'nmst1_03', d: 'medium', q: 'A, B, C, D, E एक गोल मेज़ के चारों ओर केंद्र की ओर मुँह करके बैठे हैं। B, A के ठीक बाएँ है। C, A के ठीक दाएँ है। D, B के ठीक बाएँ है। E के ठीक दाएँ कौन है?', o: ['D', 'A', 'B', 'C'], a: 0, x: 'घड़ी की दिशा में (हर व्यक्ति का बायाँ पड़ोसी अगला): A, B, D, E, C, और फिर A। E के ठीक दाएँ उससे पहले वाला, यानी <b>D</b>। टिप: गोल मेज़ पर केंद्र की ओर मुँह हो, तो किसी का बायाँ पड़ोसी घड़ी की सुई की दिशा में अगला होता है।' },
    { id: 'nmst1_04', d: 'medium', q: 'चार खिलाड़ी V, X, Y, Z एक वर्गाकार मेज़ के चारों ओर केंद्र की ओर मुँह करके बैठे ताश खेल रहे हैं। V का मुँह उत्तर की ओर है। X, V के बाएँ बैठा है और Y, V के ठीक सामने। Z का मुँह किस दिशा में है?', o: ['पश्चिम', 'पूर्व', 'दक्षिण', 'उत्तर'], a: 0, x: 'V का मुँह उत्तर की ओर है, तो V दक्षिणी भुजा पर है। उसका बायाँ हाथ पश्चिम की ओर — X पश्चिमी भुजा पर। Y सामने, उत्तरी भुजा पर। Z बची पूर्वी भुजा पर है और केंद्र की ओर देखता है, यानी <b>पश्चिम</b> की ओर।' },
    { id: 'nmst1_05', d: 'easy', q: 'छह व्यक्ति तीन-तीन की दो पंक्तियों में आमने-सामने खड़े हैं: एक पंक्ति में A, B, C और दूसरी में P, Q, R। B, A और C के बीच में है। Q, P और R के बीच में है। A के ठीक सामने R है। C के ठीक सामने कौन है?', o: ['Q', 'R', 'P', 'B'], a: 2, x: 'B और Q दोनों बीच में हैं, तो एक-दूसरे के सामने। A के सामने R है, इसलिए बचे हुए C के सामने <b>P</b> है।' },
    { id: 'nmst1_06', d: 'medium', q: 'पाँच लोग P, Q, R, S, T एक पंक्ति में उत्तर की ओर मुँह करके बैठे हैं। R सबसे बाएँ है। T, R के ठीक दाएँ है। S, Q के ठीक दाएँ है और P, S के ठीक दाएँ है। बीच में कौन है?', o: ['T', 'Q', 'S', 'P'], a: 1, x: 'बाएँ से: R, T, फिर Q-S-P एक साथ — R, T, Q, S, P। बीच (तीसरे) में <b>Q</b> है।' },
    { id: 'nmst1_07', d: 'easy', q: 'A, B, C, D, E एक पंक्ति में उत्तर की ओर मुँह करके खड़े हैं। C ठीक बीच में है। A, C के ठीक बाएँ है और E, C के ठीक दाएँ। B सबसे बाएँ है। D कहाँ खड़ा है?', o: ['C के ठीक दाएँ', 'सबसे दाएँ', 'A के ठीक बाएँ', 'सबसे बाएँ'], a: 1, x: 'बाएँ से: B, A, C, E, D। D <b>सबसे दाएँ</b> है। (C के ठीक दाएँ E है और A के ठीक बाएँ B।)' },
    { id: 'nmst1_08', d: 'medium', q: 'छह दोस्त A, B, C, D, E, F एक गोल मेज़ के चारों ओर केंद्र की ओर मुँह करके बैठे हैं। A के ठीक सामने D है। B, A के ठीक बाएँ है। C, D के ठीक बाएँ है। E, A के ठीक दाएँ है। F किसके ठीक सामने बैठा है?', o: ['A', 'C', 'E', 'B'], a: 2, x: 'घड़ी की दिशा में: A, B, F, D, C, E। (B, A का बायाँ पड़ोसी; C, D का बायाँ पड़ोसी; E, A का दायाँ पड़ोसी।) छह में ठीक सामने वाला तीन जगह आगे होता है: F के सामने <b>E</b>। टिप: गोल मेज़ पर केंद्र की ओर मुँह हो, तो किसी का बायाँ पड़ोसी घड़ी की सुई की दिशा में अगला होता है।' },
    { id: 'nmst1_09', d: 'medium', q: 'चार दोस्त P, Q, R, S एक बेंच पर उत्तर की ओर मुँह करके बैठे हैं। P और Q में से कोई भी किनारे पर नहीं है। R, P के ठीक बाएँ है। Q, S के ठीक बाएँ है। सबसे दाएँ कौन है?', o: ['P', 'S', 'R', 'Q'], a: 1, x: 'P और Q बीच की दो जगहों पर हैं। R, P के ठीक बाएँ है, तो P दूसरी जगह पर और R पहली पर। Q तीसरी जगह पर, और बची चौथी जगह पर S — सबसे दाएँ <b>S</b>।' },
    { id: 'nmst1_10', d: 'medium', q: 'A, B, C, D, E एक गोल मेज़ के चारों ओर केंद्र की ओर मुँह करके बैठे हैं। B, A के ठीक दाएँ है और C, B के ठीक दाएँ। D, A के ठीक बाएँ नहीं बैठा है। E किन दो के बीच बैठा है?', o: ['B और C', 'A और D', 'A और B', 'C और D'], a: 1, x: 'A से दाईं ओर (घड़ी की उल्टी दिशा में): B, फिर C। बची दो जगहें A के बाईं ओर हैं; A के ठीक बाएँ D नहीं है, तो वहाँ E है और उसके बाद D। इसलिए E, <b>A और D</b> के बीच है। टिप: गोल मेज़ पर केंद्र की ओर मुँह हो, तो किसी का बायाँ पड़ोसी घड़ी की सुई की दिशा में अगला होता है।' },
    { id: 'nmst1_11', d: 'easy', q: 'पाँच लड़कियाँ — गीता, सीमा, रीता, मीना और टीना — एक पंक्ति में उत्तर की ओर मुँह करके खड़ी हैं। गीता सबसे बाएँ और टीना सबसे दाएँ है। रीता, सीमा के ठीक दाएँ है और मीना, रीता के ठीक दाएँ। बीच में कौन है?', o: ['रीता', 'मीना', 'गीता', 'सीमा'], a: 0, x: 'बाएँ से: गीता, सीमा, रीता, मीना, टीना। बीच में <b>रीता</b> है।' },
    { id: 'nmst1_12', d: 'medium', q: 'सात लोग A, B, C, D, E, F, G एक पंक्ति में उत्तर की ओर मुँह करके बैठे हैं। D ठीक बीच में है। A सबसे बाएँ और G सबसे दाएँ है। C, D के ठीक बाएँ है। B, G के ठीक बाएँ है। E, F के बाईं ओर कहीं बैठा है (ठीक बगल में होना ज़रूरी नहीं)। E किसके ठीक दाएँ बैठा है?', o: ['D', 'A', 'C', 'F'], a: 1, x: 'बाएँ से: A, _, C, D, _, B, G। बची दो जगहों में E बाईं वाली पर (F के बाएँ), F दाईं वाली पर। E, <b>A</b> के ठीक दाएँ है।' },
    { id: 'nmst1_13', d: 'hard', q: 'पाँच दोस्त A, B, C, D, E एक पंक्ति में दक्षिण की ओर मुँह करके बैठे हैं। A सबसे बाएँ है और B, A के ठीक दाएँ। E सबसे दाएँ है और D, E के ठीक बाएँ। पूर्वी छोर पर कौन बैठा है?', o: ['B', 'D', 'A', 'E'], a: 2, x: 'दक्षिण की ओर मुँह करने पर बायाँ हाथ पूर्व की ओर होता है। इसलिए सबसे बाएँ बैठा व्यक्ति पूर्वी छोर पर है: <b>A</b>।' },
    { id: 'nmst1_14', d: 'medium', q: 'चार दोस्त A, B, C, D एक पंक्ति में उत्तर की ओर मुँह करके बैठे हैं। B और C के बीच ठीक दो लोग हैं। A, B के ठीक दाएँ है। D कहाँ बैठा है?', o: ['सबसे बाएँ', 'B के ठीक दाएँ', 'C के ठीक बाएँ', 'सबसे दाएँ'], a: 2, x: 'B और C के बीच दो लोग हैं, तो दोनों किनारों पर हैं। A, B के ठीक दाएँ है, इसलिए B सबसे बाएँ: B, A, D, C। D, <b>C के ठीक बाएँ</b> है।' },
    { id: 'nmst1_15', d: 'medium', q: 'पाँच दोस्त P, Q, R, S, T एक पंक्ति में उत्तर की ओर मुँह करके बैठे हैं। (यहाँ “बाएँ” और “दाएँ” का अर्थ है उस ओर कहीं भी, ठीक बगल में होना ज़रूरी नहीं।) P, R के बाएँ है पर Q के दाएँ। R, S के बाएँ है। T, Q के बाएँ है। बीच में कौन है?', o: ['R', 'Q', 'P', 'S'], a: 2, x: 'बाएँ से दाएँ क्रम: T, Q, P, R, S (T, Q से पहले; Q, P से पहले; P, R से पहले; R, S से पहले)। बीच में <b>P</b>।' }
  ],

  /* ── NMMS Bihar · Counting figures · Mark 1 (Hindi) ── */

/* Makes sure the screen on top of the stack can actually be shown right now. */
function guard() {

    if (!PUBLIC[e.s] && !user) { stack = [{ s: 'login' }]; continue; }
    /* First a course, then the app. Only a practice session that is already under way is left alone (the course can change under it
       when another tab saves): it ends in its own way, and the question comes with the next step. */
    if (user && !PUBLIC[e.s] && !NO_COURSE[e.s] && !(SESSION_SCREENS[e.s] && S) && !courseOf(user)) { stack = [{ s: 'course', p: { must: 1 } }]; continue; }
    if (e.s === 'course') {
      if (e.p && e.p.must && courseOf(user)) { stack = [{ s: 'home' }]; continue; }      // it was chosen meanwhile (another phone, another tab)
      if (e.p && e.p.at && !courseStep(e.p.at)) { if (stack.length > 1) stack.pop(); else stack = [{ s: 'course', p: { must: e.p.must } }]; continue; }
    }

      if (stack.length > 1) stack.pop(); else stack = [{ s: 'home' }];

function logoStack(cap, lit) {
  return logoMark(Math.round(cap * 223) / 100, lit) + logoName(cap, Math.round(cap * 46.3) / 100);
}
/* The line under the name. It is ordinary text in the phone's own font, stretched or squeezed by a hair so that it is
   always exactly as wide as the name above it, whatever font the phone uses. */
var LOGO_LINE = 'Padho. Samjho. Aage badho.';
function logoLine(cap) {
  var w = Math.round(cap * 481.1) / 100, h = Math.round(cap * 50) / 100;
  return '<svg class="lg-t" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><text x="0" y="' + Math.round(cap * 37.5) / 100 + '" font-size="' + Math.round(cap * 35.4) / 100 +
    '" textLength="' + w + '" lengthAdjust="spacing">' + LOGO_LINE + '</text></svg>';
}
/* Beside the name the diya is 1.55 capital heights wide and stands on the letters' line. */
function authHead(title, sub) {
  return '<div class="auth-logo-row">' + logoMark(33) + logoName(21) + '</div>' +
    '<div class="auth-title">' + title + '</div><div class="auth-sub">' + sub + '</div>';
}
function subHead(title) {
  return '<div class="sub-header"><button class="icon-btn" data-act="back" aria-label="Back">←</button><div class="sub-title">' + title + '</div></div>';
}
function toggleRow(group, key, on, label, desc) {
  return '<div class="toggle-row"><div class="toggle-info"><div class="toggle-label">' + label + '</div><div class="toggle-desc">' + desc + '</div></div>' +
    '<button class="toggle' + (on ? ' on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" aria-label="' + label +
    '" data-act="toggle" data-group="' + group + '" data-key="' + key + '"></button></div>';
}
function menuRow(attrs, ico, label, meta, extra) {
  return '<button class="menu-item' + (extra || '') + '" ' + attrs + '><span class="menu-ico">' + ico + '</span><span class="menu-lbl">' + label + '</span>' +
    (meta ? '<span class="menu-meta">' + meta + '</span>' : '') + '<span class="menu-arrow">›</span></button>';
}
function greeting() {
  var h = now().getHours();
  if (h < 5) return { e: '🌙', t: 'Studying late' };
  if (h < 12) return { e: '🌅', t: 'Good morning' };
  if (h < 17) return { e: '☀️', t: 'Good afternoon' };
  return { e: h < 21 ? '🌆' : '🌙', t: 'Good evening' };
}
function passStrength(p) {
  var s = 0, min = CONFIG.PASS_MIN;
  if (!p) return { w: 0, c: 'transparent', t: 'At least ' + min + ' characters' };
  if (p.length < min) return { w: 20, c: '#F87171', t: 'Too short — at least ' + min + ' characters' };
  if (passProblem(p, '')) return { w: 30, c: '#F87171', t: 'Too easy to guess' };
  if (p.length >= 12) s++;
  if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
  if (/\d/.test(p)) s++;
  if (/[^A-Za-z0-9]/.test(p)) s++;
  if (s <= 1) return { w: 45, c: '#FB923C', t: 'Weak — add numbers or capital letters' };
  if (s === 2) return { w: 70, c: '#FBBF24', t: 'Good' };
  return { w: 100, c: '#4ADE80', t: 'Strong' };
}
function passField(id, placeholder, auto, strength) {
  return '<div class="input-wrap"><span class="input-icon">🔒</span><input id="' + id + '" type="password" autocomplete="' + auto + '" maxlength="64" placeholder="' +
    placeholder + '" aria-label="' + placeholder + '"' + (strength ? ' data-in="pass-new"' : '') + '>' +
    '<button type="button" class="eye" data-act="toggle-pass" data-for="' + id + '">SHOW</button></div>';
}

SCREENS.splash = function () {
  return '<div class="page bg-auth splash"><div class="splash-mid">' + logoStack(48, true) + logoLine(48) +
    '</div><div class="splash-foot">Made in India · ek private pahal</div></div>';
};

function emailField(value, auto) {
  return '<div class="input-wrap"><span class="input-icon">✉</span><input id="f-email" type="email" inputmode="email" autocomplete="' + auto +
    '" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="100" placeholder="Email" aria-label="Email" value="' + esc(value || '') + '"></div>';
}
var BACK_PILL = '<button type="button" class="back-pill" data-act="back">← Back</button>';
function moving(p) { return !!(p.adopt && user && user.guest); }       // a guest is creating / signing in to an account and takes the progress along
/* "Use another email": still signed in to the unconfirmed sign-up, and creating the account that replaces it */
function restarting(p) { return !!(p.restart && db.auth && !db.auth.verified && user && !user.guest && db.auth.uid === p.restart); }

SCREENS.login = function (p) {
  var mv = moving(p);
  return '<div class="page bg-auth auth">' + (mv ? BACK_PILL : '') +
    authHead('Welcome back', mv ? 'Sign in and your guest progress comes with you' : 'Continue your prep journey') +
    '<div class="auth-form" data-enter="login"><div class="auth-error" id="err" role="alert"></div>' +
    emailField(p.email, 'username') +
    passField('f-pass', 'Password', 'current-password', false) +
    '<button type="button" class="btn btn-primary" data-act="login">SIGN IN</button>' +
    '<div class="center"><button type="button" class="link" data-act="go" data-to="forgot">Forgot password?</button></div>' +
    (mv ? '' : '<div class="divider">OR</div><button type="button" class="btn btn-sec" data-act="guest">Continue as guest</button>') + '</div>' +
    '<div class="auth-switch">New to IOPET? <button type="button" class="link" data-act="' + (mv ? 'adopt' : 'go') + '" data-to="signup">Create account</button></div></div>';
};

SCREENS.signup = function (p) {
  var mv = moving(p), rs = restarting(p), n = mv || rs ? user.answered : 0;
  return '<div class="page bg-auth auth">' + (mv || rs ? BACK_PILL : '') +
    authHead('Create account', rs ? 'This time with the right email address' : mv ? 'Free. Keeps your progress safe if the phone is lost' : 'Free. Your progress is backed up to the cloud') +
    '<div class="auth-form" data-enter="signup"><div class="auth-error" id="err" role="alert"></div>' +
    (n ? '<div class="note">Your ' + (mv ? 'guest ' : '') + 'progress (' + plural(n, 'answer') + ') moves into this account.</div>' : '') +
    '<div class="input-wrap"><span class="input-icon">👤</span><input id="f-name" type="text" autocomplete="name" maxlength="40" placeholder="Full name" aria-label="Full name" value="' +
    esc(p.name || (rs || (mv && user.name !== 'Guest') ? user.name : '')) + '"></div>' +
    emailField(p.email, 'email') +
    '<div>' + passField('f-pass', 'Create password', 'new-password', true) +
    '<div class="strength"><i id="st-bar"></i></div><div class="hint" id="st-txt">At least ' + CONFIG.PASS_MIN + ' characters</div></div>' +
    '<button type="button" class="btn btn-primary" data-act="signup">CREATE ACCOUNT</button>' +
    '<div class="hint center">We email you a link to confirm the address.</div>' +
    '<div class="center"><button type="button" class="link" data-act="go" data-to="privacy">Privacy policy</button></div></div>' +
    (rs ? '<div class="hint center">The unconfirmed sign-up for ' + esc(db.auth.email) + ' is removed once the new account exists.</div></div>'
        : '<div class="auth-switch">Already have an account? <button type="button" class="link" data-act="' + (mv ? 'adopt' : 'back') + '" data-to="login">Sign in</button></div></div>');
};

/* Shown after sign-up, and from Account while the email is still unconfirmed. */
SCREENS.verify = function (p) {
  return '<div class="page bg-auth auth">' + (p.fresh ? '' : BACK_PILL) + '<div class="otp-icon">📨</div>' +
    '<div class="auth-title center">Confirm your email</div>' +
    '<div class="auth-sub center">We sent a link to <b class="em">' + esc(db.auth.email) + '</b></div>' +
    '<div class="auth-form"><div class="auth-error" id="err" role="alert">' + esc(p.err || '') + '</div>' +
    '<div class="steps"><div><b>1.</b> Open your email app. Look in Spam too.</div><div><b>2.</b> Tap the link in the email from IOPET.</div>' +
    '<div><b>3.</b> Come back here and tap the button.</div></div>' +
    '<button type="button" class="btn btn-primary" data-act="verify-check">I HAVE CONFIRMED</button>' +
    '<button type="button" class="btn btn-sec" data-act="verify-resend">Send the email again</button>' +
    '<div class="center"><button type="button" class="link" data-act="verify-skip">' + (p.fresh ? 'Skip for now' : 'Do it later') + '</button></div></div>' +
    '<div class="hint center">Until the email is confirmed, your progress stays on this phone only, and a forgotten password cannot be recovered if the address was typed wrong.</div>' +
    '<div class="auth-switch">Typed the wrong address? <button type="button" class="link" data-act="verify-wrong">Use another email</button></div></div>';
};
AFTER.verify = function (sc) { var el = sc.querySelector('#err'); if (el && el.textContent) el.classList.add('show'); };

SCREENS.forgot = function (p) {
  return '<div class="page bg-auth auth">' + BACK_PILL +
    authHead('Reset password', 'We email you a link to choose a new password') +
    '<div class="auth-form" data-enter="forgot-send"><div class="auth-error" id="err" role="alert"></div>' +
    emailField(p.email, 'username') +
    '<button type="button" class="btn btn-primary" data-act="forgot-send">SEND RESET LINK</button></div>' +
    '<div class="hint center">The link goes only to the inbox of that email. Whoever cannot open that inbox cannot change the password.</div></div>';
};

/* The same page whether or not an account exists for that address — so nobody can test which emails are registered. */
SCREENS.sent = function (p) {
  return '<div class="page bg-auth auth"><div class="otp-icon">📬</div><div class="auth-title center">Check your email</div>' +
    '<div class="auth-sub center">If an account exists for <b class="em">' + esc(p.email || '') + '</b>, a reset link is on its way.</div>' +
    '<div class="auth-form"><div class="steps"><div><b>1.</b> Open the email from IOPET. Look in Spam too.</div><div><b>2.</b> Tap the link and choose a new password.</div>' +
    '<div><b>3.</b> Come back and sign in with the new password.</div></div>' +
    '<button type="button" class="btn btn-primary" data-act="back">BACK TO SIGN IN</button></div>' +
    '<div class="hint center">No email after a few minutes? Check the address and ask again. If you have never created an account in this app, go back and tap “Create account” first — a reset link is sent only to an existing account.</div>' +
    '<div class="hint center">Setting a new password signs you out on every other phone.</div></div>';

SCREENS.welcome = function () {
  return '<div class="page bg-auth auth welcome"><div class="success-circle"><svg width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">' +
    '<path d="M10 22l8 8 14-16" stroke="#FFF8E7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<div class="auth-title" style="margin-top:18px">You’re all set!</div><div class="auth-sub">Welcome to IOPET, ' + esc(firstName(user.name)) + '</div>' +
    '<button type="button" class="btn btn-primary" data-act="home">' + (courseOf(user) ? 'GET STARTED' : 'CHOOSE YOUR COURSE') + '</button></div>';
};

/* ── COURSE — "what are you studying for?" Shown once after the first sign-in (p.must: there is no way round it),
   and from Profile or Topics whenever the student wants to change. One screen for every step: p.at says which.
   A choice without content is shown with "Coming soon" and cannot be opened. ── */
function courseRow(c, cur, big) {
  var open = c.group || courseOpen(c.id), mine = !c.group && cur && (cur === c.id || cur.indexOf(c.id + '-') === 0), right, sub = esc(c.sub);
  if (c.group) sub += '<span class="co-state' + (c.n ? ' on' : '') + '">' + (c.n ? c.n + ' ' + c.unit[c.n === 1 ? 0 : 1] + ' available now' : 'Opening soon') + '</span>';
  right = !open ? '<span class="co-soon">Coming soon</span>' : (mine ? '<span class="co-cur">✓ Current</span>' : '') + '<span class="menu-arrow">›</span>';
  return '<button type="button" class="co-row' + (big ? ' big' : '') + (open ? '' : ' locked') + (mine ? ' current' : '') + '" data-act="course-open" data-id="' + c.id + '"' +
    (open ? '' : ' aria-disabled="true"') + (mine ? ' aria-current="true"' : '') + '><span class="co-ico" aria-hidden="true">' + (c.num ? '<b>' + c.num + '</b>' : esc(c.emoji)) + '</span>' +
    '<span class="co-info"><span class="co-name">' + esc(c.name) + '</span>' + (sub ? '<span class="co-sub">' + sub + '</span>' : '') + '</span>' +
    '<span class="co-right">' + right + '</span></button>';
}
SCREENS.course = function (p) {
  var u = user, at = p.at && courseStep(p.at) ? p.at : '', list = courseChoices(at), must = !!p.must, cur = courseOf(u), t, html, on, off;
  if (!at) {
    html = must ? '<div class="page bg-auth auth">' + authHead('Choose your course', 'What are you studying for? You can change it later in Profile.')
                : '<div class="page bg-profile">' + subHead('Course') + '<div class="sub">' + (cur ? 'Now: <b class="em">' + esc(courseName(cur)) + '</b>. ' : '') + 'Your progress in every course is kept when you switch.</div>';
    if (must && u.course && !cur) html += '<div class="alert">' + (courseName(u.course) ? 'Your course, ' + esc(courseName(u.course)) + ', is' : 'Your course is') +
      ' not in this version of the app. Update the app to go on with it. ' +
      (u.guest ? 'Or choose another course below.' : 'If you choose another course here, it becomes the course of this account on every phone.') + '</div>';
    else if (must && u.np && db.auth && db.auth.verified) html += sync.err && !has(SYNC_RETRY_MS, sync.err)
      ? '<div class="alert">Your backup could not be loaded. ' + esc(has(SYNC_MSG, sync.err) ? SYNC_MSG[sync.err] + ' ' : '') +
        'You can go on: the course you choose now becomes the course of this account on every phone.</div>'
      : '<div class="alert info">Your backup is still loading. If you chose a course on another phone, it appears here by itself.</div>';
    list.forEach(function (c) { html += courseRow(c, cur, true); });
    if (must) html += '<div class="auth-switch">' + (u.guest ? 'Guest mode' : esc(u.email)) + ' · <button type="button" class="link" data-act="signout-ask">Sign out</button></div>';
    return html + '</div>';
  }
  t = stepTitle(at).map(esc);
  html = '<div class="page ' + (must ? 'bg-auth auth">' + BACK_PILL + '<div class="auth-title">' + t[0] + '</div><div class="auth-sub">' + t[1] + '</div>'
                                     : 'bg-profile">' + subHead(t[0]) + '<div class="sub">' + t[1] + '</div>');
  if (at === 'c') {                                  // classes stay in their natural order
    html += '<div class="alert info">For ' + esc(BOARDS.map(function (b) { return b.name; }).join(', ')) + '. Class ' + STREAM_FROM + ' and ' + CLASSES[CLASSES.length - 1] +
      ' also ask for the stream: ' + esc(STREAMS.map(function (x) { return x.name; }).join(', ')) + '.</div>';
    list.forEach(function (c) { html += courseRow(c, cur, false); });
    return html + '</div>';
  }
  on = list.filter(function (c) { return courseOpen(c.id); }); off = list.filter(function (c) { return !courseOpen(c.id); });
  if (on.length) html += '<div class="tier-label">Available now</div>';
  on.forEach(function (c) { html += courseRow(c, cur, false); });
  if (off.length) html += '<div class="tier-label">Coming soon</div>';
  off.forEach(function (c) { html += courseRow(c, cur, false); });
  return html + '</div>';
};

/* ── HOME — CHANGE #1 no status bar · #2 no brand panel · #3 big streak card · #4 no sign-out here ── */
SCREENS.home = function () {
  var u = user, tk = todayKey(), st = liveStreak(u), ms = nextMilestone(st), td = dayRec(u, tk);
  var goal = u.goal.daily, left = examDaysLeft(u), g = greeting(), html, meta, sub, cta, open, rec;

  meta = left > 0 ? plural(left, 'day') + ' to ' + esc(goalOf(u).exam) : left === 0 ? esc(goalOf(u).exam) + ' is today. All the best!' : 'Ready for today’s practice?';
  sub = st === 0 ? (u.bestStreak ? 'Streak ended. Start a new one today.' : 'Answer one question to start your streak.')
      : (u.lastDay === tk ? 'Done for today. Come back tomorrow.' : 'Practice today to keep it going.');
  cta = td.n >= goal ? 'GOAL DONE · PRACTICE MORE' : td.n ? 'CONTINUE PRACTICE' : 'START PRACTICE';

  html = '<div class="page bg-dash nav-pad"><div class="dash-header"><div class="dash-hello">' +
    '<div class="greeting-badge">' + g.e + ' ' + g.t + '</div><div class="greeting-name">Hi, ' + esc(firstName(u.name)) + '!</div>' +
    '<div class="greeting-meta">' + meta + '</div></div>' +
    '<button class="avatar-circle" data-act="tab" data-tab="profile" aria-label="Open profile">' + esc(initialOf(u.name)) + '</button></div>';

  if (!Store.persistent()) html += '<div class="alert warn">Storage is blocked in this browser, so your progress will be lost when the app closes.</div>';
  if (db.auth && !db.auth.verified) html += '<button class="nudge" data-act="go" data-to="verify">✉ Confirm your email to switch on cloud backup. Tap here.</button>';
  else if (u.guest && u.answered >= 20) html += '<button class="nudge" data-act="go" data-to="account">☁ Your progress is only on this phone. Create a free account to back it up. Tap here.</button>';
  if (u.notif.streak && st > 0 && u.lastDay !== tk) html += '<div class="alert">⏰ Your ' + st + '-day streak ends at midnight. Answer one question to keep it.</div>';

  html += '<div class="card streak-card"><div class="streak-top"><div class="streak-icon">🔥</div><div class="streak-mid">' +
    '<div class="streak-count">' + st + ' day streak</div><div class="streak-sub">' + sub + '</div></div>' +
    '<div class="streak-pill-badge">Best ' + u.bestStreak + '</div></div>' +
    '<div class="milestone-row"><span><b>' + st + '/' + ms + '</b> days to next milestone</span><span>' + (ms - st) + ' to go</span></div>' +
    '<div class="pbar"><i style="width:' + pct(st, ms) + '%"></i></div></div>';

  if (u.notif.daily) {
    var nx = recommendTopic(u), nxc = nx && nx.ch && has(ICONS, nx.ch) ? chapterOf(nx) : null;
    html += '<div class="card goal-today"><div class="row between"><div class="lbl">Today’s goal</div><div class="num">' + td.n + '/' + goal + ' questions</div></div>' +
      '<div class="pbar"><i style="width:' + Math.min(100, pct(td.n, goal)) + '%"></i></div>' +
      (nxc ? '<div class="next-up">' + chIcon(nx.ch, 46) + '<span class="next-up-t"><small>NEXT UP · MARK ' + nx.mark + '</small><b lang="hi">' + esc(nxc.hi || nxc.name) + '</b><small>' + esc(nxc.name) + '</small></span></div>' : '') +
      '<button class="btn btn-primary btn-cta hop" data-act="start-smart">' + cta + '</button></div>';
  }

  if (u.notif.tips) {
    var q = QUOTES[u.quote % QUOTES.length];
    html += '<button class="quote-card" data-act="quote-next" aria-label="Show another quote"><span class="quote-text" style="display:block">“' + q.t +
      '”</span><span class="quote-src" style="display:block">— ' + q.s + ' · tap for another</span></button>';
  }

  rec = u.lastTopic;
  open = topicsOf(u).filter(function (t) { return !isLocked(u, t); });
  open.sort(function (a, b) {
    var sa = topicStats(u, a), sb = topicStats(u, b);
    var ta = topicTodo(u, a), tb = topicTodo(u, b);
    var ra = (a.id === rec && (ta || !a.mark) ? 0 : sa.attempted && ta ? 1 : ta ? 2 : 3);     // a passed Mark steps back for the next one
    var rb = (b.id === rec && (tb || !b.mark) ? 0 : sb.attempted && tb ? 1 : tb ? 2 : 3);
    return ra - rb || TOPICS.indexOf(a) - TOPICS.indexOf(b);
  });
  html += '<div class="section-head"><div class="section-head-title">CONTINUE LEARNING</div><button class="link" data-act="tab" data-tab="topics">View all →</button></div><div class="topics-grid">';
  open.slice(0, 4).forEach(function (t) {
    var s2 = topicStats(u, t), col = s2.pct >= 60 ? 'var(--green)' : s2.pct >= 25 ? 'var(--amber)' : 'var(--orange)';
    html += '<button class="topic-card-btn" data-act="start" data-topic="' + t.id + '"><span class="topic-emoji">' + (t.ch && has(ICONS, t.ch) ? chIcon(t.ch, 34) : t.emoji) + '</span>' +
      '<span class="topic-name">' + t.short + '</span><span class="topic-meta">' + s2.mastered + ' of ' + s2.total + ' mastered</span>' +
      '<span class="topic-pct" style="color:' + col + '">' + s2.pct + '% complete</span></button>';
  });
  html += '</div>';

  if (u.notif.tips) {
    var tips = tipsOf(u), tip = tips[u.tip % tips.length];
    html += '<button class="tip-card" data-act="tip-next" aria-label="Show another tip"><span class="tip-ico">💡</span><span class="grow"><span class="tip-title">' + tip.t +
      '</span><span class="tip-text">' + tip.d + '</span></span></button>';
  }
  return html + '</div>';
};

SCREENS.topics = function () {
  var u = user, html, lastSubject = null, plan = planOf(courseOf(u));
  if (plan) return '<div class="page bg-topics nav-pad">' + markTopics(u, plan) + '</div>';     // (the course is changed in Profile)
  html = '<div class="page bg-topics nav-pad"><div class="row between"><div class="h1">Topics</div>' +
    '<button class="course-pill" data-act="go" data-to="course" aria-label="Change course, now ' + esc(courseName(courseOf(u))) + '"><span>' + esc(courseShort(courseOf(u))) + '</span></button></div>';
  html += '<div class="sub">Pick a chapter. Each session is ' + plural(u.settings.size, 'question') + '.</div>';
  topicsOf(u).forEach(function (t) {
    var st = topicStats(u, t), lk = isLocked(u, t), meta, rt;
    if (t.subject !== lastSubject) { html += '<div class="tier-label">' + t.subject + '</div>'; lastSubject = t.subject; }
    if (lk) { rt = topicById(t.req.topic); meta = 'Master ' + t.req.pct + '% of ' + rt.short + ' to unlock'; }
    else meta = st.attempted ? st.mastered + ' of ' + st.total + ' mastered' : plural(st.total, 'question') + ' · not started';
    html += '<button class="topic-row' + (lk ? ' locked' : '') + '" data-act="' + (lk ? 'locked' : 'start') + '" data-topic="' + t.id + '">' +
      '<span class="topic-emoji-big" style="background:' + t.tint + '">' + t.emoji + '</span><span class="topic-info">' +
      '<span class="topic-row-name">' + t.name + '</span><span class="topic-row-meta">' + meta + '</span>' +
      (lk ? '' : '<span class="pbar thin"><i style="width:' + st.pct + '%"></i></span>') + '</span>' +
      '<span class="topic-right">' + (lk ? '🔒' : st.pct + '%') + '</span></button>';
  });
  return html + '</div>';
};

/* The Topics page of an exam studied in Marks (3.5.0): one card per chapter, sorted by where the student stands —
   on the go · ready to start · waiting · passed · coming soon. Each chapter has its own drawn icon and colour. */
function markLockText(lk, t) {

  return String(q.x).replace(/\[\[hl:([^\[\]]*)\]\]/g, function (tok, p) { return m ? '[[fig:' + m[1] + ';' + p + ']]' : ''; });
}
/* the same as plain text, for places that cannot draw (reports, copied text) */
function figPlain(s) { return plain(String(s).replace(FIG_ONE, '[figure]')); }

SCREENS.practice = function () {
  var it = S.items[S.i], q = it.q, t = topicById(S.topic), total = S.items.length;
  var answered = it.pick !== null, last = S.i === total - 1, fresh = !!S.fresh, html, ok, skipped;
  S.fresh = false;
  html = '<div class="page bg-practice"><div class="q-header"><button class="icon-btn" data-act="quit" aria-label="Quit session">✕</button>' +
    (t.ch && has(ICONS, t.ch) ? '<span class="q-ico">' + chIcon(t.ch, 26) + '</span>' : '') + '<div class="q-counter">' + t.short + ' · ' + (S.i + 1) + '/' + total + '</div>' +
    '<div class="q-timer"' + (user.settings.timer ? ' id="timer"' : '') + '>' + (user.settings.timer ? fmtTime(sessionMs()) : '') + '</div></div>' +
    '<div class="q-progress"><i' + (fresh ? ' class="grow" style="--from:' + pct(S.i, total) + '%;' : ' style="') + 'width:' + pct(S.i + (answered ? 1 : 0), total) + '%"></i></div>' +
    '<div class="q-card"><div class="q-level">' + q.d + ' · ' + t.short + '</div><div class="q-text">' + figHtml(q.q) + '</div></div><div class="opts">';
  var sel = !answered && typeof it.sel === 'number' ? it.sel : -1;
  if (q.o.every(function (o) { return /^\[\[[a-z0-9]+:[^\[\]]*\]\]$/.test(o); })) html = html.slice(0, -'<div class="opts">'.length) + '<div class="opts grid">';   /* four drawings: a 2 x 2 grid */
  it.order.forEach(function (orig, pos) {
    var cls = 'opt-btn';
    if (answered) cls += (orig === q.a ? ' correct' : orig === it.pick ? ' wrong' : ' dim') + (fresh && orig === it.pick ? ' pop' : '');
    else if (pos === sel) cls += ' sel';
    html += '<button class="' + cls + '" data-act="pick" data-i="' + pos + '"' + (answered ? ' disabled' : ' aria-pressed="' + (pos === sel) + '"') + '><span class="opt-key">' + 'ABCD'.charAt(pos) +
      '</span><span class="opt-txt">' + figHtml(q.o[orig]) + '</span>' +
      (fresh && orig === it.pick && orig === q.a ? '<span class="spark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>' + (it.xp ? '<span class="xp-fly" aria-hidden="true">+' + it.xp + ' XP</span>' : '') : '') + '</button>';
  });
  html += '</div>';
  if (answered) {
    ok = it.pick === q.a; skipped = it.pick === -1;
    html += '<div class="feedback-box ' + (ok ? 'correct-fb' : skipped ? 'skip-fb' : 'wrong-fb') + (fresh ? ' fresh' : '') + '" id="fb"><div class="fb-title">' +
      (ok ? '✓ Correct · +' + it.xp + ' XP' : skipped ? 'Skipped — here is the answer' : '✗ Not quite') + '</div><div class="fb-text">' + figHtml(explainOf(q)) + '</div></div>' +
      '<button class="btn btn-primary" data-act="next">' + (last ? 'SEE RESULTS' : 'NEXT QUESTION') + '</button>' +
      '<div class="center"><button class="link" data-act="report">Report a problem with this question</button></div>';
  } else {                                        /* choose first, then check: a slip of the finger is not an answer yet */
    html += '<button class="btn btn-primary btn-check" data-act="check"' + (sel < 0 ? ' disabled' : '') + '>CHECK</button>' +
      '<div class="center"><button class="link" data-act="skip">Skip this question</button></div>';
  }
  return html + '</div>';
};
AFTER.practice = function () { startTimer(); if (!actx) setTimeout(warmAudio, 80); };

SCREENS.summary = function () {
  var u = user, n = S.items.length, score = pct(S.correct, n), st = liveStreak(u), html, insight;
  insight = score === 100 ? (topicById(S.topic).mark ? 'Perfect round. The next test brings more questions from the pool — keep the chain going.' : 'Perfect round. Move on to the next topic, or raise the session size in Settings.')
    : score >= 70 ? 'Solid work. Review what you missed — those questions come back first in your next session.'
    : score >= 40 ? 'Halfway there. Read the explanations in Review; the questions you missed come back first next time.'
    : 'Tough round. Go through Review slowly — the questions you missed will be asked first in your next session.';
  html = '<div class="page bg-dash"><div class="summary-score"><div class="summary-big">' + score + '%</div><div class="summary-label">' +
    topicById(S.topic).name + '</div></div>' +
    '<div class="stat-grid"><div class="stat-box"><div class="stat-val" style="color:var(--green)">' + S.correct + '</div><div class="stat-lbl">CORRECT</div></div>' +
    '<div class="stat-box"><div class="stat-val" style="color:var(--red)">' + S.wrong + '</div><div class="stat-lbl">WRONG</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + S.skipped + '</div><div class="stat-lbl">SKIPPED</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + fmtTime(S.elapsed) + '</div><div class="stat-lbl">TIME</div></div></div>' +
    '<div class="xp-badge"><span class="xp-val">+' + S.xp + '</span><span class="xp-lbl">XP earned · 🔥 ' + st + ' day streak' + (st > S.streak0 ? ' (extended today)' : '') + '</span></div>';
  if (topicById(S.topic).mark) {
    var mt = topicById(S.topic);
    if (!S.passed0 && markPassed(u, mt)) html += '<div class="badge-line">🎉 ' + esc(chapterOf(mt).name) + ' · Mark ' + mt.mark + ' passed!</div>';
    else html += '<div class="badge-line">' + markLine(u, mt) + '</div>';
  }
  S.unlocked.forEach(function (name) { html += '<div class="badge-line">🔓 ' + (/^You can/.test(name) ? name : 'New topic unlocked: ' + name) + '</div>'; });
  S.newAch.forEach(function (id) {
    var a = ACH.filter(function (x) { return x.id === id; })[0];
    if (a) html += '<div class="badge-line">' + a.e + ' Achievement unlocked: ' + a.n + '</div>';
  });
  html += '<div class="insight-card"><div class="insight-title">WHAT NEXT</div><div class="insight-text">' + insight + '</div></div>' +
    '<button class="btn btn-primary" data-act="again">PRACTICE AGAIN</button>' +
    '<button class="btn btn-sec" data-act="review">Review answers</button>' +
    '<button class="btn btn-sec" data-act="home">Back to home</button></div>';
  return html;
};

SCREENS.review = function () {
  var html = '<div class="page bg-dash">' + subHead('Review answers');
  S.items.forEach(function (it, i) {
    var q = it.q, ok = it.pick === q.a, line;
    line = it.pick === -1 || it.pick === null ? '<div class="rv-line muted">You skipped this question</div>'
      : '<div class="rv-line ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : '✗') + ' Your answer: ' + figHtml(q.o[it.pick]) + '</div>';
    html += '<div class="rv-item"><div class="rv-head">Question ' + (i + 1) + ' · ' + q.d + '</div><div class="rv-q">' + figHtml(q.q) + '</div>' + line +
      (ok ? '' : '<div class="rv-line ok">Correct answer: ' + figHtml(q.o[q.a]) + '</div>') + '<div class="rv-x">' + figHtml(explainOf(q)) + '</div></div>';
  });
  return html + '<button class="btn btn-primary" data-act="back">BACK TO RESULTS</button></div>';
};

SCREENS.progress = function () {
  var u = user, days = last7(u), max = Math.max(u.goal.daily, 1), st = liveStreak(u), lv = levelOf(u.xp), html, wk, pw, recent;
  days.forEach(function (d) { if (d.n > max) max = d.n; });
  html = '<div class="page bg-progress nav-pad"><div class="h1">Progress</div><div class="sub">Built from what you have actually practiced</div>';
  if (!u.answered) {
    html += '<div class="card empty"><div class="empty-ico">📊</div><div class="empty-t">No practice yet</div>' +
      '<div class="empty-d">Finish one session and your XP, accuracy and weekly chart will show up here.</div>' +
      '<button class="btn btn-primary" data-act="start-smart" style="margin-top:14px">START PRACTICE</button></div>';
  }
  html += '<div class="prog-grid"><div class="prog-stat"><div class="prog-stat-val">' + u.xp + '</div><div class="prog-stat-lbl">Total XP</div><div class="prog-stat-note">Level ' + lv.n + ' · ' + lv.title + '</div></div>' +
    '<div class="prog-stat"><div class="prog-stat-val">' + st + '</div><div class="prog-stat-lbl">Day streak 🔥</div><div class="prog-stat-note">Best ' + u.bestStreak + '</div></div>' +
    '<div class="prog-stat"><div class="prog-stat-val">' + pct(u.correct, u.answered) + '%</div><div class="prog-stat-lbl">Accuracy</div><div class="prog-stat-note">' + u.correct + ' of ' + u.answered + ' correct</div></div>' +
    '<div class="prog-stat"><div class="prog-stat-val">' + u.answered + '</div><div class="prog-stat-lbl">Questions answered</div><div class="prog-stat-note">Best run ' + u.bestRun + ' in a row</div></div></div>';

  html += '<div class="card"><div class="row between"><div class="card-title">Questions per day</div><div class="small muted">last 7 days</div></div><div class="bars-row">';
  days.forEach(function (d) {
    html += '<div class="bar-col' + (d.today ? ' today' : '') + '"><div class="bar-num">' + (d.n || '') + '</div><div class="bar-track"><div class="bar" style="height:' +
      Math.round(d.n * 78 / max) + 'px"></div></div><div class="bar-lbl">' + d.lbl + '</div></div>';
  });
  html += '</div></div>';

  if (u.notif.weekly) {
    wk = weekTotals(u, 0, 6); pw = weekTotals(u, 7, 13);
    html += '<div class="card"><div class="card-title">Weekly summary</div>' +
      '<div class="srow"><span>Last 7 days</span><b>' + wk.n + ' Q · ' + pct(wk.c, wk.n) + '%</b></div>' +
      '<div class="srow"><span>7 days before that</span><b>' + pw.n + ' Q · ' + pct(pw.c, pw.n) + '%</b></div>' +
      '<div class="small muted">' + (wk.n > pw.n ? '▲ ' + (wk.n - pw.n) + ' more questions than the week before.' : wk.n < pw.n ? '▼ ' + (pw.n - wk.n) + ' fewer questions than the week before.' : 'Same number of questions as the week before.') + '</div></div>';
  }

  html += '<div class="card"><div class="row between"><div class="card-title">Topic mastery</div><div class="small muted course-tag">' + esc(courseName(courseOf(u))) + '</div></div>';
  topicsOf(u).forEach(function (t) {
    var s2 = topicStats(u, t), lk = isLocked(u, t);
    html += '<div><div class="mrow"><div class="mrow-name">' + t.emoji + ' ' + t.name + '</div><div class="mrow-val">' + (lk ? '🔒' : s2.mastered + '/' + s2.total) + '</div></div>' +
      '<div class="pbar thin"><i style="width:' + s2.pct + '%"></i></div></div>';
  });
  html += '</div>';

  recent = u.sessions.slice(-5).reverse();
  if (recent.length) {
    html += '<div class="card"><div class="card-title">Recent sessions</div>';
    recent.forEach(function (r) {
      var t = topicById(r.topic);
      html += '<div class="srow"><span>' + (t ? t.short : 'Session') + ' · ' + fmtShort(r.t) + '</span><b>' + nn(r.c) + '/' + nn(r.n) + ' · ' + fmtTime(nn(r.sec) * 1000) + '</b></div>';
    });
    html += '</div>';
  }
  return html + '</div>';
};

SCREENS.goals = function () {
  var u = user, left = examDaysLeft(u), td = dayRec(u, todayKey()), met = 0, t = now(), i, cd;
  for (i = 0; i < 7; i++) if (dayRec(u, dayKey(addDays(t, -i))).n >= u.goal.daily) met++;
  cd = left === null ? '' : left > 0
    ? '<div class="goal-countdown"><div class="cd-cell"><div class="cd-num">' + left + '</div><div class="cd-lbl">DAYS LEFT</div></div>' +
      '<div class="cd-cell"><div class="cd-num">' + Math.floor(left / 7) + '</div><div class="cd-lbl">FULL WEEKS</div></div>' +
      '<div class="cd-cell"><div class="cd-num">' + Math.floor(left / 30) + '</div><div class="cd-lbl">MONTHS</div></div></div>'
    : '<div class="goal-countdown"><div class="cd-cell"><div class="cd-num">' + (left === 0 ? 'Today' : 'Passed') + '</div><div class="cd-lbl">' +
      (left === 0 ? 'ALL THE BEST' : 'SET A NEW TARGET BELOW') + '</div></div></div>';
  return '<div class="page bg-profile">' + subHead('My Goals') +
    '<div class="goal-card"><div class="goal-exam">🎯 ' + esc(goalOf(u).exam) + '</div><div class="goal-date">' + fmtDate(parseDay(goalOf(u).date)) + '</div>' + cd + '</div>' +
    (u.goal.custom ? '' : '<div class="alert info">' + esc(courseGoal(courseOf(u)).note) + '</div>') +
    '<button class="btn btn-sec" data-act="goal-edit">Change exam and date</button>' +
    '<div class="card"><div class="lbl">Daily target</div><div class="stepper"><button class="step-btn" data-act="daily-step" data-d="-5" aria-label="Decrease daily target">−</button>' +
    '<div class="step-val">' + u.goal.daily + '<small>questions a day</small></div>' +
    '<button class="step-btn" data-act="daily-step" data-d="5" aria-label="Increase daily target">+</button></div>' +
    '<div class="row between small"><span class="muted">Today</span><b class="num">' + td.n + '/' + u.goal.daily + '</b></div>' +
    '<div class="pbar"><i style="width:' + Math.min(100, pct(td.n, u.goal.daily)) + '%;background:var(--green)"></i></div>' +
    '<div class="small muted">Target met on ' + met + ' of the last 7 days.</div></div></div>';
};
