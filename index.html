<html lang="en">

     (3.7.1: and, from its own web address, read its manifest and start its helper sw.js — the files next to it.) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'"/>

<!-- CHANGE #8: Google Fonts load without blocking the first paint -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/></noscript>

<style>
:root{
  /* DARK (default) — every colour of the app is one of these; [data-theme="light"] below redefines them */
  --bg:#111018;--bg-deep:#0A0910;--surface:#1D1B27;--surface-2:#262333;--surface-3:#302C40;
  --line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.17);--lip:#2C2939;--fill:rgba(255,255,255,.07);--fill-2:rgba(255,255,255,.13);
  --ink:#FFF8E7;--ink2:rgba(255,248,231,.74);--ink3:rgba(255,248,231,.54);
  --cream:var(--ink);--cream60:var(--ink2);--cream40:var(--ink3);--border:var(--line);
  --purple:#B39DFF;--purple-dark:#4C1D95;--brand:#7C5CFF;--brand-lip:#4E2FC4;--brand-ink:#FFFFFF;
  --go:#DCD4C3;--go-ink:#15131D;--go-lip:#7D7768;
  --green:#4ADE80;--amber:#FBBF24;--red:#F87171;--blue:#38BDF8;--orange:#FB923C;
  --ok-bg:rgba(74,222,128,.12);--ok-line:rgba(74,222,128,.38);--ok-ink:#BBF7D0;--ok-lip:#1F7A43;
  --bad-bg:rgba(248,113,113,.12);--bad-line:rgba(248,113,113,.42);--bad-ink:#FECACA;--bad-lip:#8E2A2A;
  --warn-bg:rgba(251,191,36,.12);--warn-line:rgba(251,191,36,.34);--warn-ink:#FDE68A;
  --info-bg:rgba(56,189,248,.10);--info-line:rgba(56,189,248,.28);--info-ink:#BAE6FD;
  --pur-bg:rgba(167,139,250,.14);--pur-line:rgba(167,139,250,.34);
  --nav:#1A1824;--modal:#1F1C2B;--scrim:rgba(5,3,12,.74);--toast:#2A2540;--shadow:rgba(0,0,0,.55);
  --glow-a:rgba(124,92,255,.30);--glow-b:rgba(56,189,248,.16);--glow-c:rgba(251,146,60,.18);
  --bar:#221C3E;                    /* the phone's top bar (BAR in app.js, the same value): the top of the app fades out of it */
  --ic-p:#FFFFFF;--ic-ps:#C9C5DA;--ic-pes:#B3AECB;--ic-pef:#D8D4E6;--ic-pw:#3B2C24;--ic-pedge:transparent;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;--r-pill:50px;
  /* system fonts first-paint, Google Fonts swap in when loaded; Hindi always uses the phone's own Devanagari font */
  --font-display:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F4F2F8;--bg-deep:#E6E3EE;--surface:#FFFFFF;--surface-2:#F3F1F8;--surface-3:#E8E5F0;
  --line:rgba(30,22,64,.11);--line-2:rgba(30,22,64,.18);--lip:#DAD5E6;--fill:rgba(30,22,64,.055);--fill-2:rgba(30,22,64,.10);
  --ink:#1B1630;--ink2:#4A4363;--ink3:#686182;
  --purple:#6A3FE0;--brand:#7C5CFF;--brand-lip:#5233D1;
  --go:#25203A;--go-ink:#FFFFFF;--go-lip:#0B0818;
  --green:#15803D;--amber:#B45309;--red:#DC2626;--blue:#0369A1;--orange:#C2410C;
  --ok-bg:#E6F8EC;--ok-line:#7BD99A;--ok-ink:#14532D;--ok-lip:#86D3A0;
  --bad-bg:#FDECEC;--bad-line:#F2A3A3;--bad-ink:#7F1D1D;--bad-lip:#EDB0B0;
  --warn-bg:#FFF6DD;--warn-line:#F4D27A;--warn-ink:#78350F;
  --info-bg:#E8F5FD;--info-line:#9CD3F2;--info-ink:#0C4A6E;
  --pur-bg:#F0EBFF;--pur-line:#CDBDFB;
  --nav:#FFFFFF;--modal:#FFFFFF;--scrim:rgba(24,18,48,.45);--toast:#2A2440;--shadow:rgba(40,30,90,.16);
  --glow-a:rgba(124,92,255,.16);--glow-b:rgba(56,189,248,.14);--glow-c:rgba(251,146,60,.14);
  --bar:#EAE6F8;
  --ic-p:#FFFFFF;--ic-ps:#CFCADF;--ic-pes:#8F89A8;--ic-pef:#DAD6E7;--ic-pw:#FFF1E4;--ic-pedge:rgba(40,30,80,.12);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden;background:var(--bg-deep);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;background:none;border:0;outline:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
input,textarea{font-family:inherit;color:inherit;outline:0;border:0;background:none;border-radius:0}
input::-webkit-input-placeholder,textarea::-webkit-input-placeholder{color:var(--cream40)}
input::placeholder,textarea::placeholder{color:var(--cream40)}
input:-webkit-autofill{-webkit-text-fill-color:var(--ink);transition:background-color 99999s ease-out 0s}
sub,sup{font-size:.72em;line-height:0}
[hidden]{display:none !important}

/* ── LAYOUT: fixed to the viewport edges, no vh/dvh units needed ── */
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;background:var(--bg-deep)}
.phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:500px) and (min-height:560px){
  .phone{width:390px;height:844px;max-height:calc(100% - 28px);border-radius:40px;box-shadow:0 0 0 1px var(--line),0 30px 80px var(--shadow)}
}
#screens,.screen{position:absolute;top:0;right:0;bottom:0;left:0}
.screen{overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;animation:scr .2s ease-out}
.screen::-webkit-scrollbar{display:none}
/* one light fade per screen; never starts invisible, so a throttled WebView still shows content */
@keyframes scr{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.screen.quiet{animation:none}
.calm .screen{animation:none}
.calm *{transition:none !important}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* ── LOGO: the diya is two drawn shapes (bowl, flame), the name is an outline — no font, nothing to download ── */
.lg{position:relative;display:block;flex:none}
.lg svg{position:absolute;top:0;left:0;width:100%;height:100%}
.lg-b,.lg-n{fill:var(--ink)}
.lg-f{fill:#FFB020}
.lg-n,.lg-t{display:block;flex:none;max-width:100%;height:auto}   /* on a very narrow screen the whole logo shrinks together */
/* the phone's own font on purpose: it is there at once, so the words never jump when the web fonts arrive */
.lg-t{overflow:visible;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;fill:#FFB020}
/* The splash lights the diya once: the flame grows from the wick, the name brightens with it, then the line below appears.
   Only transform and opacity change, so nothing is laid out again; it is over before the splash ends and never repeats. */
.lg-lit .lg-f{transform-origin:50% 68.35%;animation:lg-light .42s cubic-bezier(.3,.7,.3,1) .06s both}
.lg-lit+.lg-n{animation:lg-glow .42s ease-out .06s both}
.lg-lit~.lg-t{animation:lg-in .26s ease-out .26s both}
@keyframes lg-light{0%{opacity:0;transform:scale(.3)}35%{opacity:1}65%{transform:scale(1.03,1.09)}100%{opacity:1;transform:none}}
@keyframes lg-glow{from{opacity:.4}to{opacity:1}}
@keyframes lg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* "Reduce animations" leaves the opening logo alone: it plays once, for under half a second, and costs nothing (see app.js boot). */
@media (prefers-reduced-motion:reduce){.lg-f,.lg-n,.lg-t{animation:none !important}}

/* CHANGE #9: top padding 24px (28px on auth screens) — the fake status bar is gone (CHANGE #1) */
.page{min-height:100%;padding:24px 18px 32px}
.page.auth{padding-top:28px;padding-left:22px;padding-right:22px}
.page.nav-pad{padding-bottom:108px}
.page>*+*{margin-top:12px}
.bg-auth{background:var(--bg);background:radial-gradient(130% 55% at 20% 0%,var(--glow-a),transparent 70%),var(--bg)}
.bg-dash{background:var(--bg);background:radial-gradient(130% 42% at 15% 0%,var(--glow-a),transparent 72%),var(--bg)}
.bg-practice{background:var(--bg)}
.bg-topics{background:var(--bg);background:radial-gradient(130% 40% at 85% 0%,var(--glow-b),transparent 72%),var(--bg)}
.bg-progress{background:var(--bg);background:radial-gradient(130% 40% at 15% 0%,var(--glow-b),transparent 72%),var(--bg)}
.bg-profile{background:var(--bg);background:radial-gradient(130% 40% at 50% 0%,var(--glow-a),transparent 72%),var(--bg)}

/* ── SHARED PIECES ── */
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.h1{font-size:24px;font-weight:900;line-height:1.2}
.sub{font-size:13px;color:var(--cream60);margin-top:2px !important}
.lbl{font-size:10px;font-weight:800;color:var(--cream40);letter-spacing:1.6px;text-transform:uppercase}
.num{font-family:var(--font-display);font-weight:700}
.muted{color:var(--cream60)}
.small{font-size:11.5px;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:15px}
.card>*+*{margin-top:10px}
.btn{display:block;width:100%;padding:15px;border-radius:var(--r-lg);font-size:14.5px;font-weight:900;letter-spacing:.5px;text-align:center;transition:transform .07s ease-out;margin-bottom:5px}
.btn:active{transform:translateY(4px)}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 5px 0 var(--brand-lip);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn-primary:active{box-shadow:0 1px 0 var(--brand-lip)}
.btn-sec{background:var(--surface);border:1.5px solid var(--line-2);box-shadow:0 4px 0 var(--lip);color:var(--ink);font-size:13.5px;font-weight:800;padding:13px}
.btn-danger{background:var(--bad-bg);border:1.5px solid var(--bad-line);box-shadow:0 4px 0 var(--bad-lip);color:var(--bad-ink);font-size:13.5px;font-weight:800;padding:13px}
.link{display:inline-block;color:var(--purple);font-size:12px;font-weight:800;padding:8px 6px}
.link.block{display:block;width:100%;text-align:center}
.pbar{height:6px;background:var(--fill-2);border-radius:6px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:6px;background:var(--purple)}
.pbar.thin{height:4px;margin-top:7px}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);font-size:17px;line-height:1;text-align:center}
.icon-btn:active{background:var(--surface-3)}
.alert{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:11px 13px;font-size:12px;font-weight:700;color:var(--warn-ink);line-height:1.5}
.alert.warn{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.alert.info{background:var(--info-bg);border-color:var(--info-line);color:var(--info-ink);font-weight:600}
.empty{text-align:center;padding:22px 16px}
.empty-ico{font-size:34px}
.empty-t{font-size:15px;font-weight:800;margin-top:6px}
.empty-d{font-size:12px;color:var(--cream60);margin-top:4px;line-height:1.5}

/* ── INPUTS ── */
.input-wrap{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:0 12px}
.input-wrap:focus-within{border-color:var(--purple);background:var(--pur-bg)}
.input-wrap input{flex:1;min-width:0;width:100%;padding:13px 4px;font-size:16px;font-weight:600}
.input-icon{flex:none;width:24px;text-align:center;opacity:.65;font-size:15px}
.eye{flex:none;font-size:11px;font-weight:800;color:var(--purple);padding:10px 4px}
.field-lbl{display:block;font-size:11px;font-weight:800;color:var(--cream60);letter-spacing:.4px;margin-bottom:6px}
textarea.ta{display:block;width:100%;min-height:110px;resize:none;background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--r-md);padding:12px;font-size:16px;line-height:1.45}
textarea.ta:focus{border-color:var(--purple)}
input[type=date]{color-scheme:inherit}

/* ── SPLASH ── */
.splash{display:flex;flex-direction:column;align-items:center;text-align:center}
.splash-mid{margin:auto 0;display:flex;flex-direction:column;align-items:center}
.splash-mid .lg-t{margin-top:12px}
.splash-foot{flex:none;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;color:var(--cream60);letter-spacing:.6px}
/* The opening screen always wears the diya's own dark colours, whatever the theme (3.7.1): the installed app opens on the same
   dark ground the phone shows while it starts it, and a light phone never flashes white before the diya */
.splash{--bg:#111018;--glow-a:rgba(124,92,255,.30);--ink:#FFF8E7;--ink2:rgba(255,248,231,.74);--cream60:rgba(255,248,231,.74);color:#FFF8E7;color-scheme:dark}

/* ── AUTH ── */
.auth-logo-row{display:flex;align-items:flex-end;margin-bottom:12px}   /* the diya stands on the same line as the letters */
.auth-logo-row .lg-n{margin-left:11px}
.auth-title{font-size:24px;font-weight:900;line-height:1.2}
.auth-sub{font-size:13px;color:var(--cream60);margin-top:4px !important}
.auth-form{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-xl);padding:18px;margin-top:18px !important}
.auth-form>*+*{margin-top:10px}
.auth-error{display:none;background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--r-md);padding:10px 12px;font-size:12px;font-weight:700;color:var(--bad-ink);line-height:1.45}
.auth-error.show{display:block}
.auth-switch{text-align:center;font-size:12px;color:var(--cream40)}
.divider{display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--cream40);letter-spacing:.5px}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:var(--line-2)}
.divider:before{margin-right:10px}
.divider:after{margin-left:10px}
.strength{height:4px;background:var(--fill-2);border-radius:4px;overflow:hidden;margin-top:6px !important}
.strength>i{display:block;height:100%;width:0;border-radius:4px;transition:width .2s,background-color .2s}
.hint{font-size:11px;color:var(--cream40);margin-top:5px !important;min-height:15px}
.back-pill{display:inline-block;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:8px 14px;font-size:12px;font-weight:700;color:var(--cream60);margin-bottom:6px}
.back-pill:active{background:var(--surface-3)}

/* ── CONFIRM EMAIL / RESET LINK ── */
.otp-icon{font-size:48px;text-align:center}
.em{color:var(--cream);word-break:break-all}
.steps{font-size:12.5px;color:var(--cream60);line-height:1.75}
.steps b{color:var(--cream);margin-right:4px}
.note{background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:var(--r-md);padding:10px 12px;font-size:12px;font-weight:700;color:var(--ok-ink);line-height:1.45}
.hint.center{text-align:center;line-height:1.5}

/* ── WELCOME ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.success-circle{width:90px;height:90px;border-radius:50%;background:#22c55e;background:linear-gradient(135deg,#4ade80,#22c55e);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px rgba(74,222,128,.35)}
.welcome .btn{max-width:280px;margin-top:26px}

/* ── DASHBOARD (CHANGE #2: no brand panel, CHANGE #4: no sign-out here) ── */
.dash-header{display:flex;align-items:center;justify-content:space-between}
.dash-hello{flex:1;min-width:0;padding-right:12px}
.greeting-badge{display:inline-block;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-2);font-size:10px;font-weight:800;letter-spacing:.5px;margin-bottom:6px}
.greeting-name{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greeting-meta{font-size:12px;color:var(--cream60);margin-top:3px}
.avatar-circle{flex:none;width:44px;height:44px;border-radius:50%;background:#7c3aed;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:2px solid var(--line-2);color:#fff;font-size:17px;font-weight:900;text-align:center;box-shadow:0 3px 0 var(--brand-lip)}

/* CHANGE #3: enlarged streak card — 52px icon, 24px count, 20px padding, milestone bar */
.streak-card{padding:20px 18px;border-radius:var(--r-xl);background:var(--surface);background:linear-gradient(135deg,var(--warn-bg),transparent 70%),var(--surface);border:1px solid var(--warn-line);box-shadow:0 4px 0 var(--lip)}
.streak-top{display:flex;align-items:center}
.streak-icon{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(251,191,36,.24);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 18px rgba(251,191,36,.28);margin-right:14px}
.streak-mid{flex:1;min-width:0}
.streak-count{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1.1}
.streak-sub{font-size:12px;color:var(--cream60);margin-top:3px}
.streak-pill-badge{flex:none;background:var(--fill);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:6px 11px;font-size:11px;font-weight:800;white-space:nowrap;margin-left:8px}
.milestone-row{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--cream60);margin-top:14px !important}
.milestone-row b{color:var(--amber);font-family:var(--font-display)}
.streak-card .pbar{margin-top:7px}
.streak-card .pbar>i{background:#FBBF24;background:linear-gradient(90deg,#FBBF24,#FB923C)}

.goal-today .num{font-size:15px}
.goal-today .pbar>i{background:#4ADE80;background:linear-gradient(90deg,#4ADE80,#38BDF8)}
.quote-card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:var(--r-lg);padding:13px 14px 13px 16px}
.quote-text{font-size:12.5px;color:var(--ink2);line-height:1.6;font-style:italic}
.quote-src{font-size:10.5px;color:var(--cream40);font-weight:700;margin-top:5px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-top:16px !important}
.section-head-title{font-size:12px;font-weight:800;letter-spacing:1px}
.topics-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:9px;gap:9px}
.topic-card-btn{display:block;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:13px;transition:transform .07s;margin-bottom:3px}
.topic-card-btn:active{transform:translateY(3px);box-shadow:none}
.topic-card-btn>span{display:block}
.topic-emoji{font-size:20px}
.topic-name{font-size:13px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-meta{font-size:10.5px;color:var(--cream60);margin-top:2px}
.topic-pct{font-size:10px;font-weight:800;margin-top:4px}
.tip-card{display:flex;align-items:center;width:100%;background:var(--info-bg);border:1px solid var(--info-line);border-radius:var(--r-md);padding:12px 14px}
.tip-ico{flex:none;font-size:20px;margin-right:12px}
.tip-title{display:block;font-size:12px;font-weight:800}
.tip-text{display:block;font-size:11px;color:var(--cream60);margin-top:2px;line-height:1.45}

/* ── TOPICS ── */
.tier-label{font-size:9.5px;font-weight:800;color:var(--cream40);letter-spacing:1.5px;margin-top:18px !important;text-transform:uppercase}
.topic-row{display:flex;align-items:center;width:100%;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:13px 14px;margin-top:10px !important;transition:transform .07s}
.topic-row:active{transform:translateY(3px);box-shadow:0 0 0 var(--lip)}
.topic-row.locked{opacity:.55}
.topic-emoji-big{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-right:13px}
.topic-info{flex:1;min-width:0;display:block}
.topic-row-name{display:block;font-size:14px;font-weight:800}
.topic-row-meta{display:block;font-size:11px;color:var(--cream60);margin-top:2px}
.topic-info .pbar{display:block}
.topic-right{flex:none;margin-left:10px;font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--cream60)}

/* ── PRACTICE ── */
.q-header{display:flex;align-items:center;justify-content:space-between}
.q-counter{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--cream60);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-timer{flex:none;min-width:38px;text-align:right;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--amber)}
.q-progress{height:8px;background:var(--fill-2);border-radius:5px;overflow:hidden}
.q-progress>i{display:block;height:100%;border-radius:5px;background:#4ADE80;background:linear-gradient(90deg,#4ADE80,#38BDF8)}
.q-card{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:17px}
.q-level{font-size:10px;font-weight:800;color:var(--amber);letter-spacing:1.5px;margin-bottom:9px;text-transform:uppercase}
.q-text{font-size:17px;font-weight:700;line-height:1.65}
.opt-btn{display:flex;align-items:center;width:100%;background:var(--surface);border:2px solid var(--line-2);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-md);padding:13px 14px;font-size:15px;font-weight:700;line-height:1.4;margin-top:9px !important;transition:transform .1s}
.opt-btn:active{transform:translateY(3px);box-shadow:none;background:var(--surface-2)}
.opt-btn[disabled]{cursor:default;transform:none}
.opt-btn.correct{background:var(--ok-bg);border-color:var(--ok-line);box-shadow:0 3px 0 var(--ok-lip)}
.opt-btn.wrong{background:var(--bad-bg);border-color:var(--bad-line);box-shadow:0 3px 0 var(--bad-lip)}
.opt-btn.dim{opacity:.55}
.opt-key{flex:none;width:25px;height:25px;line-height:22px;border-radius:50%;border:1.5px solid var(--line-2);text-align:center;font-size:11px;font-weight:800;margin-right:11px}
.opt-btn.correct .opt-key{background:#22C55E;border-color:#22C55E;color:#fff}
.opt-btn.wrong .opt-key{background:#EF4444;border-color:#EF4444;color:#fff}
.opt-txt{flex:1;min-width:0}
.feedback-box{border-radius:var(--r-md);padding:12px 14px}
.feedback-box.correct-fb{background:var(--ok-bg);border:1.5px solid var(--ok-line)}
.feedback-box.wrong-fb{background:var(--bad-bg);border:1.5px solid var(--bad-line)}
.feedback-box.skip-fb{background:var(--surface);border:1.5px solid var(--line-2)}
.fb-title{font-size:12.5px;font-weight:800;margin-bottom:4px}
.correct-fb .fb-title{color:var(--green)}
.wrong-fb .fb-title{color:var(--red)}
.fb-text{font-size:14px;color:var(--ink);line-height:1.7}

/* ── SUMMARY / REVIEW ── */
.summary-score{text-align:center;padding:10px 0 2px}
.summary-big{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1}
.summary-label{font-size:13px;color:var(--cream60);margin-top:6px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-gap:8px;gap:8px}
.stat-box{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-md);padding:12px 4px;text-align:center}
.stat-val{font-family:var(--font-display);font-size:20px;font-weight:700}
.stat-lbl{font-size:9.5px;color:var(--cream60);margin-top:3px;letter-spacing:.4px}
.xp-badge{text-align:center;padding:13px;background:var(--pur-bg);border:1px solid var(--pur-line);border-radius:var(--r-md)}
.xp-val{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--purple)}
.xp-lbl{font-size:12px;color:var(--cream60);margin-left:6px}
.insight-card{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-md);padding:13px 14px}
.insight-title{font-size:11.5px;font-weight:800;color:var(--amber);margin-bottom:4px;letter-spacing:.4px}
.insight-text{font-size:12.5px;color:var(--ink);line-height:1.55}
.badge-line{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink);border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;font-weight:700;line-height:1.5}
.rv-item{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:14px}
.rv-head{font-size:10px;font-weight:800;letter-spacing:1.2px;color:var(--cream40);text-transform:uppercase}
.rv-q{font-size:13.5px;font-weight:700;line-height:1.55;margin-top:6px}
.rv-line{font-size:12.5px;line-height:1.5;margin-top:7px}
.rv-line.ok{color:var(--green)}
.rv-line.bad{color:var(--red)}
.rv-x{font-size:12px;color:var(--cream60);line-height:1.55;margin-top:7px}

/* ── PROGRESS ── */
.prog-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.prog-stat{background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:14px}
.prog-stat-val{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}
.prog-stat-lbl{font-size:11px;color:var(--cream60);margin-top:5px}
.prog-stat-note{font-size:10px;font-weight:800;color:var(--green);margin-top:4px}
.card-title{font-size:13px;font-weight:800}
.bars-row{display:flex;align-items:flex-end}
.bar-col{flex:1;min-width:0;text-align:center;padding:0 3px}
.bar-num{font-family:var(--font-display);font-size:10px;font-weight:700;color:var(--cream60);height:15px;line-height:15px}
.bar-track{height:78px;display:flex;align-items:flex-end}
.bar{width:100%;min-height:3px;border-radius:5px 5px 0 0;background:var(--pur-line)}
.bar-col.today .bar{background:#A78BFA;background:linear-gradient(180deg,#c4b5fd,#7c3aed)}
.bar-lbl{font-size:9.5px;font-weight:800;color:var(--cream40);margin-top:5px}
.bar-col.today .bar-lbl{color:var(--cream)}
.mrow{display:flex;align-items:center}
.mrow-name{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-val{flex:none;font-family:var(--font-display);font-size:11.5px;font-weight:700;color:var(--cream60);margin-left:8px}
.srow{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding-top:9px;border-top:1px solid var(--line)}
.srow b{font-family:var(--font-display)}

/* ── PROFILE + SUB-SCREENS ── */
.prof-header{text-align:center;padding:6px 0 2px}
.prof-avatar{width:80px;height:80px;line-height:80px;margin:0 auto 12px;border-radius:50%;background:#7c3aed;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-size:32px;font-weight:900;box-shadow:0 8px 30px rgba(124,58,237,.4)}
.prof-name{font-size:20px;font-weight:900;line-height:1.25;word-wrap:break-word;overflow-wrap:break-word}
.prof-email{font-size:12px;color:var(--cream60);margin-top:3px;word-break:break-all}
.prof-rank{display:inline-block;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r-pill);padding:5px 12px;font-size:11px;font-weight:800;color:var(--amber);margin-top:10px}
.menu-item{display:flex;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 0 var(--lip);border-radius:var(--r-md);padding:14px 15px;margin-top:8px !important}
.menu-item:active{background:var(--surface-2)}
.menu-ico{flex:none;width:28px;font-size:18px;text-align:center;margin-right:11px}
.menu-lbl{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.menu-meta{flex:none;max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;color:var(--cream60);margin-right:8px}
.menu-arrow{flex:none;font-size:16px;color:var(--cream40)}
.menu-item.wrap .menu-meta{white-space:normal;text-align:right;line-height:1.35}
.menu-item.danger .menu-lbl{color:var(--red)}
.sign-out{display:block;width:100%;padding:14px;background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:var(--r-md);font-size:13px;font-weight:800;color:var(--red);text-align:center;margin-top:16px !important}
.sign-out:active{opacity:.75}
.sub-header{display:flex;align-items:center}
.sub-title{font-size:20px;font-weight:900;margin-left:12px}
.toggle-row{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-top:8px !important}
.toggle-info{flex:1;min-width:0;padding-right:12px}
.toggle-label{font-size:13.5px;font-weight:700}
.toggle-desc{font-size:11px;color:var(--cream60);margin-top:2px;line-height:1.45}
.toggle{flex:none;position:relative;width:46px;height:26px;border-radius:26px;background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--line-2);transition:background-color .15s}
.toggle:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .15s}
.toggle:before{content:'';position:absolute;top:-11px;right:-10px;bottom:-11px;left:-10px}   /* 66x48 tap area around the 46x26 switch */
.toggle.on{background:#22c55e}
.toggle.on:after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:var(--r-md);padding:3px}
.seg-btn{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;font-weight:800;text-align:center;color:var(--cream60)}
.seg-btn.on{background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-lip)}
.stepper{display:flex;align-items:center}
.step-btn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 3px 0 var(--lip);font-size:20px;font-weight:800;line-height:1;text-align:center}
.step-btn:active{transform:translateY(3px);box-shadow:none}
.step-val{flex:1;text-align:center;font-family:var(--font-display);font-size:24px;font-weight:700}
.step-val small{display:block;font-family:var(--font-body);font-size:10.5px;font-weight:700;color:var(--cream60)}
.goal-card{background:var(--pur-bg);border:1px solid var(--pur-line);border-radius:var(--r-lg);padding:18px}
.goal-exam{font-family:var(--font-display);font-size:21px;font-weight:700;word-break:break-word}
.goal-date{font-size:12px;color:var(--cream60);margin-top:4px}
.goal-countdown{display:flex;background:var(--surface);border-radius:var(--r-md);padding:14px 6px;margin-top:14px}
.cd-cell{flex:1;text-align:center}
.cd-num{font-family:var(--font-display);font-size:23px;font-weight:700;line-height:1}
.cd-lbl{font-size:9.5px;font-weight:800;color:var(--cream60);margin-top:5px;letter-spacing:.6px}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.ach-card{display:block;background:var(--surface);border:1px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:14px 10px;text-align:center}
.ach-card:active{transform:translateY(3px);box-shadow:none}
.ach-card.earned{background:var(--warn-bg);border-color:var(--warn-line)}
.ach-card>span{display:block}
.ach-emoji{font-size:30px;line-height:1.2}
.ach-card.locked .ach-emoji{opacity:.35}
.ach-name{font-size:12.5px;font-weight:800;margin-top:6px}
.ach-desc{font-size:10.5px;color:var(--cream60);margin-top:3px;line-height:1.35}
.ach-card .pbar{margin-top:9px}
.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-top:8px !important;overflow:hidden}
.faq-q{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 15px;font-size:13px;font-weight:800;line-height:1.4}
.faq-chev{flex:none;margin-left:10px;color:var(--cream40);font-size:13px;transition:transform .15s}
.faq-item.open .faq-chev{transform:rotate(180deg)}
.faq-a{display:none;padding:0 15px 14px;font-size:12.5px;color:var(--cream60);line-height:1.6}
.faq-item.open .faq-a{display:block}
.foot-note{text-align:center;font-size:11px;color:var(--cream40);line-height:1.6;margin-top:18px !important}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:30px !important}
.about-full{font-size:12px;font-weight:700;color:var(--cream60);letter-spacing:.3px;margin-top:10px}
.about-sub{font-size:11px;color:var(--cream40);margin-top:2px}
.about+.foot-note{margin-top:6px !important}

/* ── COURSE CHOOSER ── a row that cannot be opened ("Coming soon") is dimmed, its label is not */
.co-row{display:flex;align-items:center;width:100%;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--lip);border-radius:var(--r-lg);padding:13px 14px;margin-top:10px !important;transition:transform .07s}
.co-row:active{transform:translateY(3px);box-shadow:none}
.co-row.big{padding:17px 15px;margin-top:12px !important}
.co-row.current{border-color:var(--ok-line);background:var(--ok-bg)}
.co-row.locked:active{transform:none;box-shadow:0 3px 0 var(--lip)}
.co-row.locked .co-ico,.co-row.locked .co-info{opacity:.55}
.co-ico{flex:none;width:42px;height:42px;border-radius:12px;background:var(--pur-bg);display:flex;align-items:center;justify-content:center;font-size:21px;margin-right:13px}
.co-ico b{font-family:var(--font-display);font-size:18px;font-weight:700}
.co-row.big .co-ico{width:50px;height:50px;border-radius:14px;font-size:25px}
.co-info{flex:1;min-width:0;display:block}
.co-name{display:block;font-size:14.5px;font-weight:800;line-height:1.3}
.co-row.big .co-name{font-size:16px}
.co-sub{display:block;font-size:11.5px;color:var(--cream60);margin-top:2px;line-height:1.45}
.co-state{display:block;font-size:10.5px;font-weight:800;color:var(--cream60);margin-top:5px}
.co-state.on{color:var(--green)}
.co-state:before{content:'';display:inline-block;width:7px;height:7px;border:1.5px solid currentColor;border-radius:50%;margin-right:6px}   /* the dot and the arrow below are drawn, not letters: no phone can lack them */
.co-state.on:before{background:currentColor}
.co-right{flex:none;display:flex;align-items:center;margin-left:10px}
.co-soon{font-size:10px;font-weight:800;letter-spacing:.3px;background:var(--fill);border:1px solid var(--line-2);border-radius:var(--r-pill);padding:4px 9px;white-space:nowrap}
.co-cur{font-size:10.5px;font-weight:800;color:var(--green);margin-right:8px;white-space:nowrap}
.course-pill{position:relative;flex:none;max-width:62%;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 2px 0 var(--lip);border-radius:var(--r-pill);padding:7px 12px;font-size:11.5px;font-weight:800;white-space:nowrap}
.course-pill:before{content:'';position:absolute;top:-8px;right:0;bottom:-8px;left:0}   /* a taller tap area for the small pill */
.course-pill span{min-width:0;overflow:hidden;text-overflow:ellipsis;margin-right:6px}
.course-pill:after{content:'';flex:none;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.course-pill:active{background:var(--surface-3)}
.course-tag{flex:1;min-width:0;margin-left:12px;text-align:right;line-height:1.35}   /* takes the room the title leaves; a long course name goes on two lines, nothing is cut */

/* long email addresses and server messages must wrap instead of pushing the page sideways */
.auth-error,.auth-sub,.m-text,.m-err,.m-list-item,.note,.hint,.alert,.nudge,.toast>span,.busy-t,.small{word-wrap:break-word;word-break:break-word;overflow-wrap:anywhere}

/* ── ACCOUNT & BACKUP ── */
.nudge{display:block;width:100%;text-align:left;background:var(--info-bg);border:1px solid var(--info-line);border-radius:var(--r-md);padding:11px 13px;font-size:12px;font-weight:700;color:var(--info-ink);line-height:1.5}
.nudge:active{opacity:.8}
.acct-email{font-size:15px;font-weight:800;word-break:break-all;margin-top:4px !important}
.chip{display:inline-block;border-radius:var(--r-pill);padding:4px 11px;font-size:11px;font-weight:800}
.chip.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-ink)}
.chip.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.detail{color:var(--cream40);word-break:break-word;margin-top:4px !important}
.detail:empty{display:none}
.btn[disabled]{opacity:.5}
.policy .card-title{margin-bottom:2px}

/* ── BOTTOM NAV (CHANGE #6: solid background, no backdrop-filter) ── */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:center;padding-bottom:14px;z-index:40;pointer-events:none}
.bottom-nav.show{display:flex}
.nav-pill{display:flex;align-items:center;padding:7px 8px;border-radius:var(--r-pill);background:var(--nav);border:1px solid var(--line-2);box-shadow:0 8px 28px var(--shadow);pointer-events:auto}
.nav-item{display:block;padding:7px 15px;margin:0 1px;border-radius:var(--r-pill);text-align:center;color:var(--ink3)}
.nav-item svg{display:block;width:22px;height:22px;margin:0 auto 2px}
.nav-item.active{background:var(--pur-bg);color:var(--purple)}
.nav-lbl{display:block;font-size:9px;font-weight:800;letter-spacing:.4px;line-height:1.1}

/* ── MODAL + TOAST (in-app, no browser confirm()/alert()) ── */
.modal{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--scrim);z-index:60}
.modal.open{display:flex}
.m-card{width:100%;max-width:340px;max-height:100%;overflow-y:auto;background:var(--modal);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:20px;box-shadow:0 20px 60px var(--shadow)}
.m-card>*+*{margin-top:12px}
.m-emoji{font-size:40px;text-align:center;line-height:1.2}
.m-title{font-size:17px;font-weight:900;line-height:1.3}
.m-text{font-size:13px;color:var(--cream60);line-height:1.55}
.m-err{display:none;font-size:12px;font-weight:700;color:var(--red)}
.m-err.show{display:block}
.m-actions{display:flex;margin-top:16px !important}
.m-actions .btn{flex:1;padding:13px 8px;font-size:13.5px}
.m-actions .btn+.btn{margin-left:10px}
.m-list{max-height:230px;max-height:54vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.m-list-item{font-size:12px;line-height:1.5;padding:9px 0;border-top:1px solid var(--line)}
.m-list-item:first-child{border-top:0}
.m-list-item b{display:block;font-size:12.5px}
.toast{position:absolute;left:0;right:0;top:14px;text-align:center;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;z-index:70}
.toast.show{opacity:1;visibility:visible}
.toast>span{display:inline-block;max-width:86%;background:var(--toast);color:#FFF8E7;border:1px solid rgba(167,139,250,.4);border-radius:18px;padding:11px 18px;font-size:12.5px;font-weight:700;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.5)}

/* ── "PLEASE WAIT" (sign in, create account, delete account …) ── */
.busy{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--scrim);z-index:80}
.busy.show{display:flex}
.busy-card{min-width:150px;max-width:260px;background:var(--modal);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px 22px;text-align:center;box-shadow:0 20px 60px var(--shadow)}
.spin{width:26px;height:26px;margin:0 auto;border:2.5px solid rgba(167,139,250,.25);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
.busy-t{font-size:13px;font-weight:700;line-height:1.4;margin-top:12px}

@media (max-width:340px){
  .page{padding-left:14px;padding-right:14px}
  .streak-card{padding-left:14px;padding-right:14px}
  .streak-icon{width:46px;height:46px;font-size:25px;margin-right:11px}
  .streak-count{font-size:21px}
  .nav-item{padding:7px 11px}
  .stat-grid{grid-template-columns:1fr 1fr}
  }
/* ── FIGURES in questions (drawn by figHtml) ── lines and numbers take the colour of the text around them; a "?" is amber */
.figs{display:block;text-align:center;margin:10px 0 2px;line-height:0}
.fig{display:inline-block;vertical-align:middle;margin:4px 6px;line-height:1.3}
.fig svg{display:block;overflow:visible}
.fig text{fill:currentColor;font-family:var(--font-display);font-weight:700}
.fig .fig-lbl{font-family:var(--font-body);font-weight:800;opacity:.8}
.fig .fig-q,.fig-grid td.fig-q{fill:var(--amber);color:var(--amber);font-weight:800}
.fig-line{fill:none;stroke:currentColor;stroke-width:1.6;stroke-opacity:.75}
.fig-hub{fill:var(--fill-2);stroke:currentColor;stroke-width:1.4;stroke-opacity:.7}
.fig-grid{border-collapse:collapse;margin:0 auto}
.fig-grid td{min-width:40px;height:36px;padding:2px 8px;border:1.5px solid var(--line-2);text-align:center;font-family:var(--font-display);font-size:15px;font-weight:700}
.opt-txt .figs{margin:0;text-align:left}
.opt-txt .fig{margin:0}
.rv-q .figs,.rv-line .figs,.rv-x .figs,.fb-text .figs{margin:6px 0 2px}
/* ── MOTION THAT HELPS THE EYE (3.4.0) ── short, only where something just changed; none with "Reduce animations" or a phone set
   to reduce motion. The answer arrives (explanation rises in, the chosen option gives a small pop, the progress bar grows),
   a dialog opens softly, and every tappable thing answers the finger. */
.feedback-box.fresh{animation:fb-in .24s ease-out}
.opt-btn.pop{animation:opt-pop .26s ease-out}
.q-progress>i.grow{animation:qp-grow .35s ease-out}
.modal.open{animation:m-fade .16s ease-out}
.modal.open .m-card{animation:m-pop .2s ease-out}
@keyframes fb-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes opt-pop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes qp-grow{from{width:var(--from)}}
@keyframes m-fade{from{opacity:0}to{opacity:1}}
@keyframes m-pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.calm .feedback-box.fresh,.calm .opt-btn.pop,.calm .q-progress>i.grow,.calm .modal.open,.calm .modal.open .m-card{animation:none}
@media (prefers-reduced-motion:reduce){.feedback-box.fresh,.opt-btn.pop,.q-progress>i.grow,.modal.open,.modal.open .m-card{animation:none}}
.link:active{opacity:.55}
.quote-card:active,.tip-card:active,.faq-q:active{background:var(--surface-2)}
.seg-btn:active{background:var(--fill-2)}
.seg-btn.on:active{background:var(--brand)}
.avatar-circle:active{transform:scale(.95)}
.nav-item{transition:background-color .15s,color .15s}
.nav-item:active{background:var(--fill)}
.nav-item.active:active{background:var(--pur-line)}
[data-theme="light"] .lg-t,[data-theme="light"] .lg-f{fill:#E08A00}
[data-theme="light"] .opt-key{color:var(--ink2)}

/* ── CHAPTER ICONS (icons.js) ── paper-white parts follow the theme */
.chi{display:block;flex:none;overflow:visible}
.chi .p{fill:var(--ic-p);stroke:var(--ic-pedge);stroke-width:1}
.chi .ps{fill:var(--ic-ps)}
.chi .pe-s{stroke:var(--ic-pes)}
.chi .pe-f{fill:var(--ic-pef)}
.chi .pw{fill:var(--ic-pw)}
.chi text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.chi.dim{opacity:.5;filter:saturate(.35)}

/* ── TOPICS of an exam in Marks: the hero, the slots, one card per chapter ── */
.mat-hero{position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:0 4px 0 var(--lip);border-radius:var(--r-xl);padding:16px 16px 14px;overflow:hidden}
.mat-hero:before{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:160px;border-radius:50%;background:var(--glow-a);filter:blur(30px);opacity:.9;pointer-events:none}
.mat-hero>*{position:relative}
.mh-kick{display:flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}
.mh-info{flex:none;width:20px;height:20px;margin-left:7px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink3);font-family:Georgia,serif;font-style:italic;font-size:12px;font-weight:700;line-height:17px;text-align:center;padding:0;text-transform:none;letter-spacing:0}
.mh-info:active{background:var(--fill-2)}
.mh-title{font-size:26px;font-weight:900;line-height:1.25;margin-top:5px}
.mh-sub{font-size:13px;font-weight:700;color:var(--ink2);margin-top:3px}
.mh-art{flex:none;display:flex;margin:-4px -2px 0 8px}
.mh-foot{display:flex;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-2)}
.mh-slots{flex:none;display:flex}
.slot{flex:none;width:44px;height:44px;border-radius:14px;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;margin-right:8px;color:var(--ink3);padding:0}
.slot.full{border:2px solid var(--line);background:var(--surface-2);box-shadow:0 3px 0 var(--lip)}
.slot.full:active{box-shadow:0 0 0 var(--lip);transform:translateY(3px)}
.mh-prog{flex:1;min-width:0;display:flex;align-items:center;margin-left:4px}
.mh-prog>svg{flex:none}
.mh-n{flex:none;font-size:12.5px;font-weight:800;color:var(--ink3);margin:0 8px 0 5px}
.mh-n b{font-size:16px;color:var(--ink)}
.mh-bar{flex:1;min-width:24px;height:8px;border-radius:8px;background:var(--fill-2);overflow:hidden}
.mh-bar>i{display:block;height:100%;border-radius:8px;background:#FFC233}
/* the subjects, as picture tiles (3.7.0) */
.subj-row{display:flex;overflow-x:auto;margin:0 0 14px;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.subj-row::-webkit-scrollbar{display:none}
.subj{flex:none;width:74px;margin-right:8px;display:flex;flex-direction:column;align-items:center;padding:0;background:none;border:0;color:var(--ink)}
.subj-ico{width:64px;height:58px;border-radius:18px;border:2px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--lip)}
.subj.on .subj-ico{border-color:var(--brand);background:rgba(124,92,255,.12);box-shadow:0 3px 0 var(--brand-lip)}
.subj-t{font-size:12.5px;font-weight:900;margin-top:6px;line-height:1.2;white-space:nowrap}
.subj.on .subj-t:after{content:'';display:block;height:3px;width:30px;margin:4px auto 0;border-radius:3px;background:var(--brand)}
.subj.soon .subj-ico .chi{opacity:.5;filter:saturate(.25)}
.subj.soon .subj-t{color:var(--ink3)}
.subj-soon{font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);margin-top:1px}
.subj.soon:active .subj-ico{transform:translateY(3px);box-shadow:0 0 0 var(--lip)}
.ch-card{position:relative;flex-wrap:wrap;align-items:center;padding:14px;border-width:1.5px}
.ch-card .ch-ico{position:relative;flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;margin-right:13px}
.ch-card .ch-ico:before{content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;border-radius:50%;background:var(--hl);opacity:.22;filter:blur(8px)}
.ch-card .ch-ico .chi{position:relative}
.ch-card.big .ch-ico{width:64px;height:64px}
.ch-name{display:block;font-size:17.5px;font-weight:800;line-height:1.35}
.ch-kick{display:block;font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.ch-card .topic-row-meta{font-size:12px;margin-top:4px;line-height:1.45}
.ch-prog{display:flex;align-items:center;margin-top:9px}
.ch-bar{flex:1;min-width:0;display:block;height:8px;border-radius:8px;background:var(--fill-2);overflow:hidden}
.ch-bar>i{display:block;height:100%;border-radius:8px;background:var(--h);min-width:0}
.ch-flag{flex:none;display:flex;color:var(--ink3);margin:0 5px 0 6px}
.ch-n{flex:none;font-size:12.5px;font-weight:800;color:var(--ink2)}
.ch-card .topic-right{align-self:flex-start;margin-left:8px}
.ch-chip{display:inline-block;font-family:var(--font-body);font-size:10.5px;font-weight:900;letter-spacing:.3px;padding:4px 9px;border-radius:var(--r-pill);background:var(--fill);border:1px solid var(--line-2);color:var(--ink2)}
.ch-chip.new{background:var(--hs);border-color:var(--hs);color:#fff;box-shadow:0 2px 0 var(--hd)}
.ch-lock{display:flex;color:var(--ink3)}
.ch-done{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#22C55E;color:#fff;box-shadow:0 2px 0 #15803D}
.ch-card.big{border-color:var(--h);border-width:2px;box-shadow:0 4px 0 var(--hs)}
.ch-card.big:active{box-shadow:0 0 0 var(--hs);transform:translateY(4px)}
.ch-go{display:block;flex:0 0 100%;margin-top:13px;padding-bottom:5px}
.ch-go>span{display:flex;align-items:center;justify-content:center;padding:11px;border-radius:var(--r-md);background:var(--go);color:var(--go-ink);font-size:15px;font-weight:900;letter-spacing:.3px;
  box-shadow:0 4px 0 var(--go-lip);transition:transform .07s ease-out}
.ch-go svg{margin-right:7px}
.ch-card.big:active .ch-go>span{transform:translateY(3px);box-shadow:0 1px 0 var(--go-lip)}
.ch-card.k-locked{opacity:1;background:var(--surface-2);box-shadow:0 2px 0 var(--lip)}
.ch-card.k-locked .ch-ico,.ch-card.k-locked .topic-info{opacity:.62}
.ch-card.k-locked .ch-ico .chi{filter:saturate(.55)}
.ch-card.k-soon{background:transparent;box-shadow:none;border-style:dashed}
.ch-card.k-soon .ch-ico,.ch-card.k-soon .topic-info{opacity:.55}
.ch-card.k-soon .ch-ico .chi{filter:saturate(.3)}
.ch-card.k-done{border-color:var(--ok-line)}
.m-icon{position:relative;width:72px;height:72px;margin:0 auto}
.m-lock{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--modal);border:2px solid var(--line-2);color:var(--ink2);display:flex;align-items:center;justify-content:center}

/* ── HOME: the next chapter, the raised practice button that asks to be pressed ── */
.next-up{display:flex;align-items:center;margin-top:2px !important}
.next-up .chi{margin-right:11px}
.next-up-t{flex:1;min-width:0;line-height:1.35}
.next-up-t b{display:block;font-size:16px;font-weight:800}
.next-up-t small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3)}
.topic-card-btn .chi{margin-bottom:2px}
.btn-cta{position:relative;font-size:15.5px;padding:16px;letter-spacing:1px}
.btn-cta.hop{animation:cta-hop 6.5s ease-in-out .7s 3}
@keyframes cta-hop{0%,14%,100%{transform:none}3%{transform:translateY(-5px)}6%{transform:translateY(0)}9%{transform:translateY(-2.5px)}12%{transform:translateY(0)}}
.btn-cta.hop:active{animation:none}
.q-ico{flex:none;margin-left:10px}

/* ── ANSWER FEEDBACK: a pop and a few sparks for right, a shake for wrong ── */
.opt-btn{position:relative}
.opt-btn.pop.correct{animation:opt-ok .42s cubic-bezier(.3,1.6,.5,1)}
.opt-btn.pop.wrong{animation:opt-no .38s ease-in-out}
@keyframes opt-ok{0%{transform:scale(1)}40%{transform:scale(1.035) translateY(-2px)}100%{transform:none}}
@keyframes opt-no{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.spark{position:absolute;left:26px;top:50%;width:0;height:0;pointer-events:none}
.spark i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;opacity:0;animation:spark .6s ease-out forwards}
.spark i:nth-child(1){background:#FFC233;--x:-26px;--y:-24px}
.spark i:nth-child(2){background:#22C55E;--x:0;--y:-34px}
.spark i:nth-child(3){background:#33B5F0;--x:26px;--y:-24px}
.spark i:nth-child(4){background:#F2559A;--x:34px;--y:2px}
.spark i:nth-child(5){background:#FFC233;--x:24px;--y:26px}
.spark i:nth-child(6){background:#8E63F7;--x:-2px;--y:32px}
.spark i:nth-child(7){background:#22C55E;--x:-26px;--y:24px}
.spark i:nth-child(8){background:#FF8A3D;--x:-34px;--y:0}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1.2)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.xp-fly{position:absolute;right:14px;top:50%;margin-top:-11px;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--green);pointer-events:none;opacity:0;animation:xp-fly .9s ease-out forwards}
@keyframes xp-fly{0%{opacity:0;transform:translateY(6px)}25%{opacity:1;transform:translateY(-4px)}100%{opacity:0;transform:translateY(-26px)}}
.fb-title{font-size:15px}
.summary-big.count{font-variant-numeric:tabular-nums}

/* ── CELEBRATION (a Mark passed): the chapter's icon turns over in 3D and lands, rays turn behind it, confetti falls ──
   Only transform and opacity move (the phone's graphics chip does that work); the confetti is one small canvas that stops by itself. */
.cele{position:absolute;top:0;right:0;bottom:0;left:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;
  background:var(--bg);background:radial-gradient(90% 55% at 50% 38%,var(--glow-a),transparent 75%),var(--bg);animation:cele-in .25s ease-out}
/* 3.7.2 the phone's top bar and the app meet without a line: on a phone (the app fills the screen) its top 24px — the screens'
   own top margin — fade out of the bar's colour. It stays put while a screen scrolls under it, and lies over a dimmed screen
   (a question box) but under the messages and the "please wait" card; the celebration brings its own. On a tablet or a computer
   (the phone-sized frame) there is no such edge, so nothing changes there. */
@media not all and (min-width:500px) and (min-height:560px){
  .phone::after{content:'';position:absolute;top:0;left:0;right:0;height:24px;background:linear-gradient(var(--bar),transparent);pointer-events:none;z-index:65}
  .cele{background:linear-gradient(var(--bar),transparent 24px),radial-gradient(90% 55% at 50% 38%,var(--glow-a),transparent 75%),var(--bg)}
}
.cele canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.cele-stage{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center;perspective:600px}
.cele-rays{position:absolute;top:-30px;left:-30px;width:240px;height:240px;border-radius:50%;opacity:.55;
  background:repeating-conic-gradient(from 0deg,var(--hl) 0deg 9deg,transparent 9deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:rays 9s linear infinite;will-change:transform}
.cele-icon{position:relative;transform-style:preserve-3d;animation:flip3d 1.15s cubic-bezier(.2,.9,.25,1.12) both;will-change:transform}
.cele-icon .chi{filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
.cele-badge{position:absolute;right:-8px;bottom:-4px;width:46px;height:46px;border-radius:50%;background:#22C55E;color:#fff;display:flex;align-items:center;justify-content:center;
  border:4px solid var(--bg);box-shadow:0 4px 0 #15803D;animation:badge-pop .45s cubic-bezier(.3,1.7,.5,1) .95s both}
.cele-badge svg{width:24px;height:24px}
.cele-t{font-size:28px;font-weight:900;line-height:1.2;margin-top:26px;animation:rise .45s ease-out .55s both}
.cele-s{font-size:15px;font-weight:700;color:var(--ink2);margin-top:8px;line-height:1.5;max-width:300px;animation:rise .45s ease-out .7s both}
.cele-s b{color:var(--ink)}
.cele .btn{max-width:300px;margin-top:28px;animation:rise .45s ease-out .9s both}
@keyframes cele-in{from{opacity:0}to{opacity:1}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes flip3d{0%{opacity:0;transform:translateY(60px) scale(.3) rotateY(-540deg) rotateX(25deg)}60%{opacity:1;transform:translateY(-14px) scale(1.12) rotateY(-30deg) rotateX(0)}
  80%{transform:translateY(4px) scale(.96) rotateY(8deg)}100%{transform:none}}
@keyframes badge-pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.calm .cele,.calm .cele-icon,.calm .cele-badge,.calm .cele-t,.calm .cele-s,.calm .cele .btn,.calm .cele-rays{animation:none}
.calm .btn-cta.hop,.calm .opt-btn.pop,.calm .spark,.calm .xp-fly{animation:none}
.calm .spark,.calm .xp-fly{display:none}
@media (prefers-reduced-motion:reduce){
  .cele,.cele-icon,.cele-badge,.cele-t,.cele-s,.cele .btn,.cele-rays,.btn-cta.hop,.opt-btn.pop{animation:none}
  .spark,.xp-fly{display:none}
}

/* ── CHOOSE, THEN CHECK (3.6.0) ── the chosen option stands out; CHECK wakes up only when something is chosen */
.opt-btn.sel{border-color:var(--brand);background:var(--pur-bg);box-shadow:0 3px 0 var(--brand-lip)}
.opt-btn.sel .opt-key{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-check{margin-top:16px !important}
.btn-check[disabled]{opacity:1;background:var(--fill-2);color:var(--ink3);box-shadow:0 5px 0 var(--fill);text-shadow:none}

/* ── NON-VERBAL FIGURES ── ink on paper, like the exam; colour only in the explanation patches (H1–H4) */
.fv-l{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.fv-k{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:5 4;opacity:.8}
.fv-f{fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.fv-h{stroke-width:2;stroke-linejoin:round;fill-opacity:.55}
.fv-h1{fill:#FFC233;stroke:#CF8E00}
.fv-h2{fill:#33B5F0;stroke:#0A7DB3}
.fv-h3{fill:#F2559A;stroke:#B52E69}
.fv-h4{fill:#33C25E;stroke:#1E8A40}
.fig .fv-lbl{fill:currentColor;font-family:var(--font-body);font-weight:800;opacity:.75}
.fig .fw-t{fill:currentColor;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800}
.fig-word,.fig-fig{color:var(--ink)}
.fig-fig svg,.fig-word svg{max-width:100%;height:auto}
.opts.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:10px;gap:10px;margin-top:4px}
.opts.grid .opt-btn{position:relative;flex-direction:column;justify-content:center;min-width:0;min-height:96px;margin-top:0 !important;padding:22px 8px 12px}
.opts.grid .opt-key{position:absolute;top:7px;left:7px;width:22px;height:22px;line-height:19px;font-size:10px;margin:0}
.opts.grid .opt-txt{flex:none;display:flex;align-items:center;justify-content:center;width:100%}
.opts.grid .figs{margin:0;text-align:center}
.opts.grid .fig,.opts.grid .figs{display:block;width:100%;margin:0}
.opts.grid .fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
/* small examples side by side in an explanation (counting: one coloured example of each kind) */
.fb-text .fig-fig svg,.rv-x .fig-fig svg{width:auto;max-width:92px;max-height:82px}
.fb-text .figs .fig-fig,.rv-x .figs .fig-fig{margin:4px 5px}
.fb-text .fig-word svg,.rv-x .fig-word svg{max-width:200px}
.fig-wide{display:block;margin:6px 0}
.fig-wide svg,.fb-text .fig-wide svg,.rv-x .fig-wide svg{width:100%;max-width:420px;max-height:none;height:auto;margin:0 auto}
</style>
</head>
<body>
<div id="app">
  <div class="phone" id="phone">
    <!-- CHANGE #1: no fake status bar (clock / signal / battery) — the real phone already shows one -->
    <div id="screens"></div>

    <nav class="bottom-nav" id="nav" aria-label="Main">

    { id: 'law6', d: 'medium', q: 'A 5 kg block rests on a horizontal table (g = 10 m/s²). The normal reaction on the block is', o: ['0.5 N', '5 N', '10 N', '50 N'], a: 3, x: 'The block is in vertical equilibrium, so N = mg = 5 × 10 = 50 N.' },
    { id: 'law7', d: 'hard',   q: 'A person of mass 50 kg stands in a lift that accelerates upward at 2 m/s² (g = 10 m/s²). The apparent weight is', o: ['100 N', '400 N', '500 N', '600 N'], a: 3, x: 'For upward acceleration N − mg = ma, so N = m(g + a) = 50 × 12 = 600 N.' },
    { id: 'law8', d: 'hard',   q: 'Masses of 2 kg and 3 kg hang from a light string over a frictionless pulley (g = 10 m/s²). The acceleration of the system is', o: ['1 m/s²', '2 m/s²', '5 m/s²', '10 m/s²'], a: 1, x: 'a = (m<sub>2</sub> − m<sub>1</sub>)g ÷ (m<sub>1</sub> + m<sub>2</sub>) = (3 − 2) × 10 ÷ 5 = 2 m/s².' }
  ],

  /* ── Physics: Work, Energy and Power ── */
  wep: [
    { id: 'wep1', d: 'easy',   q: 'The SI unit of work is the', o: ['newton', 'joule', 'watt', 'pascal'], a: 1, x: 'Work = force × displacement, measured in newton-metre, which is called the joule (J).' },
    { id: 'wep2', d: 'easy',   q: 'A force acts perpendicular to the displacement of a body. The work done by this force is', o: ['maximum', 'negative', 'zero', 'infinite'], a: 2, x: 'W = Fs cos θ. For θ = 90°, cos θ = 0, so no work is done — like the centripetal force in uniform circular motion.' },
    { id: 'wep3', d: 'easy',   q: 'The kinetic energy of a 2 kg body moving at 3 m/s is', o: ['3 J', '6 J', '9 J', '18 J'], a: 2, x: 'KE = ½mv² = ½ × 2 × 9 = 9 J.' },
    { id: 'wep4', d: 'medium', q: 'If the speed of a body is doubled, its kinetic energy becomes', o: ['double', 'four times', 'half', 'eight times'], a: 1, x: 'KE is proportional to v². Doubling v makes KE 2² = 4 times.' },
    { id: 'wep5', d: 'medium', q: 'A 60 W bulb glows for 5 minutes. The energy it consumes is', o: ['300 J', '3,000 J', '12,000 J', '18,000 J'], a: 3, x: 'Energy = power × time = 60 W × 300 s = 18,000 J (18 kJ).' },
    { id: 'wep6', d: 'medium', q: 'A 5 kg body is raised through 10 m (g = 10 m/s²). The gain in potential energy is', o: ['50 J', '250 J', '500 J', '5,000 J'], a: 2, x: 'PE = mgh = 5 × 10 × 10 = 500 J.' },
    { id: 'wep7', d: 'hard',   q: 'A body is dropped from a height h. At what height above the ground is its kinetic energy equal to its potential energy?', o: ['h/4', 'h/3', 'h/2', '3h/4'], a: 2, x: 'The total energy mgh is shared equally when KE = PE, so PE = mgh/2, which happens at height h/2.' },
    { id: 'wep8', d: 'hard',   q: 'A spring of force constant 200 N/m is compressed by 0.1 m. The energy stored in it is', o: ['1 J', '2 J', '10 J', '20 J'], a: 0, x: 'U = ½kx² = ½ × 200 × (0.1)² = 1 J.' }
  ],

  /* ── Physics: Thermodynamics ── */
  thr: [
    { id: 'thr1', d: 'easy',   q: 'The first law of thermodynamics is a statement of the conservation of', o: ['momentum', 'energy', 'mass', 'charge'], a: 1, x: 'ΔU = Q − W: heat given to a system either raises its internal energy or is used to do work. Energy is conserved.' },
    { id: 'thr2', d: 'easy',   q: 'Which quantity remains constant in an isothermal process?', o: ['Pressure', 'Volume', 'Temperature', 'Heat'], a: 2, x: '“Iso-thermal” means same temperature. Pressure and volume both change, with PV = constant for an ideal gas.' },
    { id: 'thr3', d: 'easy',   q: 'In an adiabatic process', o: ['the temperature stays constant', 'no heat is exchanged with the surroundings', 'the pressure stays constant', 'no work is done'], a: 1, x: 'Adiabatic means Q = 0. Any work done comes from (or goes into) the internal energy, so the temperature changes.' },
    { id: 'thr4', d: 'medium', q: 'The work done by a gas in an isochoric (constant-volume) process is', o: ['zero', 'maximum', 'equal to the heat supplied', 'negative'], a: 0, x: 'W = PΔV. With no change in volume ΔV = 0, so W = 0 and all the heat supplied changes the internal energy.' },
    { id: 'thr5', d: 'medium', q: 'A system absorbs 500 J of heat and does 200 J of work. The change in its internal energy is', o: ['+700 J', '+300 J', '−300 J', '+200 J'], a: 1, x: 'ΔU = Q − W = 500 − 200 = +300 J.' },
    { id: 'thr6', d: 'medium', q: 'The efficiency of a Carnot engine working between 400 K and 300 K is', o: ['25%', '33%', '75%', '100%'], a: 0, x: 'η = 1 − T<sub>cold</sub>/T<sub>hot</sub> = 1 − 300/400 = 0.25, that is 25%.' },
    { id: 'thr7', d: 'hard',   q: 'For an ideal gas undergoing isothermal expansion, the change in internal energy is', o: ['positive', 'negative', 'zero', 'equal to the work done'], a: 2, x: 'The internal energy of an ideal gas depends only on temperature. The temperature is constant, so ΔU = 0 and Q = W.' },
    { id: 'thr8', d: 'hard',   q: 'A Carnot engine takes 1000 J of heat per cycle from a source at 500 K and rejects heat to a sink at 300 K. The work done per cycle is', o: ['200 J', '400 J', '600 J', '1000 J'], a: 1, x: 'η = 1 − 300/500 = 0.4, so W = η × Q = 0.4 × 1000 = 400 J.' }
  ],

  /* ── Chemistry: Structure of Atom ── */
  atm: [
    { id: 'atm1', d: 'easy',   q: 'The electron was discovered by', o: ['J.J. Thomson', 'Ernest Rutherford', 'James Chadwick', 'Niels Bohr'], a: 0, x: 'J.J. Thomson discovered the electron in 1897 through cathode-ray experiments. Chadwick discovered the neutron; Rutherford, the nucleus.' },
    { id: 'atm2', d: 'easy',   q: 'The nucleus of the atom was discovered through the', o: ['cathode-ray experiment', 'alpha-particle scattering experiment', 'oil-drop experiment', 'photoelectric effect'], a: 1, x: 'In Rutherford’s gold-foil experiment a few alpha particles bounced straight back, showing a tiny, dense, positively charged nucleus.' },
    { id: 'atm3', d: 'easy',   q: 'The maximum number of electrons that the M shell (n = 3) can hold is', o: ['2', '8', '18', '32'], a: 2, x: 'Maximum electrons in a shell = 2n² = 2 × 3² = 18.' },
    { id: 'atm4', d: 'medium', q: 'The number of neutrons in an atom of sodium-23 (atomic number 11) is', o: ['11', '12', '23', '34'], a: 1, x: 'Neutrons = mass number − atomic number = 23 − 11 = 12.' },
    { id: 'atm5', d: 'medium', q: 'An orbital with n = 3 and l = 2 is a', o: ['3s orbital', '3p orbital', '3d orbital', '3f orbital'], a: 2, x: 'l = 0, 1, 2, 3 stand for s, p, d, f, so n = 3 with l = 2 is 3d. A 3f orbital cannot exist because l must be less than n.' },
    { id: 'atm6', d: 'medium', q: 'Which rule says that the orbitals of a subshell are each filled singly before any pairing begins?', o: ['Aufbau principle', 'Pauli exclusion principle', 'Hund’s rule', 'Heisenberg uncertainty principle'], a: 2, x: 'Hund’s rule of maximum multiplicity: in p, d and f subshells, pairing starts only after every orbital holds one electron.' },
    { id: 'atm7', d: 'hard',   q: 'The ground-state electronic configuration of chromium (Z = 24) is', o: ['[Ar] 3d<sup>4</sup> 4s<sup>2</sup>', '[Ar] 3d<sup>5</sup> 4s<sup>1</sup>', '[Ar] 3d<sup>6</sup>', '[Ar] 3d<sup>3</sup> 4s<sup>2</sup> 4p<sup>1</sup>'], a: 1, x: 'A half-filled d subshell is extra stable, so chromium is 3d<sup>5</sup> 4s<sup>1</sup> rather than the expected 3d<sup>4</sup> 4s<sup>2</sup>.' },
    { id: 'atm8', d: 'hard',   q: 'The total number of orbitals in the shell with n = 4 is', o: ['4', '8', '16', '32'], a: 2, x: 'Orbitals in a shell = n² = 16 (one 4s, three 4p, five 4d, seven 4f). The shell can therefore hold 32 electrons.' }
  ],

  /* ── Chemistry: Chemical Bonding ── */
  bnd: [
    { id: 'bnd1', d: 'easy',   q: 'A bond formed by the complete transfer of electrons from one atom to another is', o: ['a covalent bond', 'an ionic bond', 'a hydrogen bond', 'a metallic bond'], a: 1, x: 'Electron transfer gives oppositely charged ions held together by electrostatic attraction — an ionic (electrovalent) bond, as in NaCl.' },
    { id: 'bnd2', d: 'easy',   q: 'The two nitrogen atoms in N<sub>2</sub> are joined by a', o: ['single bond', 'double bond', 'triple bond', 'coordinate bond'], a: 2, x: 'Each nitrogen needs three more electrons for an octet, so the atoms share three pairs: N≡N.' },
    { id: 'bnd3', d: 'easy',   q: 'The shape of the methane (CH<sub>4</sub>) molecule is', o: ['square planar', 'tetrahedral', 'trigonal planar', 'linear'], a: 1, x: 'Carbon is sp<sup>3</sup> hybridised with four bond pairs and no lone pair, giving a tetrahedron with 109.5° angles.' },
    { id: 'bnd4', d: 'medium', q: 'The hybridisation of carbon in CO<sub>2</sub> is', o: ['sp', 'sp<sup>2</sup>', 'sp<sup>3</sup>', 'sp<sup>3</sup>d'], a: 0, x: 'Carbon forms two sigma bonds and has no lone pair, so it is sp hybridised and the molecule is linear (180°).' },
    { id: 'bnd5', d: 'medium', q: 'The H–O–H bond angle in water is about', o: ['90°', '104.5°', '109.5°', '120°'], a: 1, x: 'Oxygen is sp<sup>3</sup> hybridised, but its two lone pairs repel the bond pairs more strongly, squeezing the angle from 109.5° to about 104.5°.' },
    { id: 'bnd6', d: 'medium', q: 'According to VSEPR theory, the shape of NH<sub>3</sub> is', o: ['trigonal planar', 'tetrahedral', 'trigonal pyramidal', 'bent'], a: 2, x: 'Nitrogen has three bond pairs and one lone pair. The electron pairs are arranged tetrahedrally, but the molecule itself is trigonal pyramidal (107°).' },
    { id: 'bnd7', d: 'hard',   q: 'Which of these molecules has zero dipole moment?', o: ['H<sub>2</sub>O', 'NH<sub>3</sub>', 'CO<sub>2</sub>', 'HF'], a: 2, x: 'CO<sub>2</sub> is linear, so its two equal C=O bond dipoles point in opposite directions and cancel. The other three molecules are polar.' },
    { id: 'bnd8', d: 'hard',   q: 'The hybridisation of sulphur in SF<sub>6</sub> is', o: ['sp<sup>3</sup>', 'sp<sup>3</sup>d', 'sp<sup>3</sup>d<sup>2</sup>', 'dsp<sup>2</sup>'], a: 2, x: 'Six bond pairs and no lone pair need six hybrid orbitals: sp<sup>3</sup>d<sup>2</sup>, giving an octahedral molecule.' }
  ],

  /* ── Biology: Cell: The Unit of Life ── */
  cel: [
    { id: 'cel1', d: 'easy',   q: 'Which organelle is called the powerhouse of the cell?', o: ['Nucleus', 'Mitochondrion', 'Ribosome', 'Golgi apparatus'], a: 1, x: 'Mitochondria produce most of the cell’s ATP through aerobic respiration.' },
    { id: 'cel2', d: 'easy',   q: 'The cell theory was proposed by', o: ['Schleiden and Schwann', 'Watson and Crick', 'Singer and Nicolson', 'Robert Hooke'], a: 0, x: 'Schleiden (plants, 1838) and Schwann (animals, 1839) proposed the cell theory. Virchow later added that all cells arise from pre-existing cells.' },
    { id: 'cel3', d: 'easy',   q: 'Protein synthesis in a cell takes place on', o: ['lysosomes', 'ribosomes', 'centrioles', 'vacuoles'], a: 1, x: 'Ribosomes translate mRNA into polypeptide chains. They are found free in the cytoplasm and attached to the rough ER.' },
    { id: 'cel4', d: 'medium', q: 'Which organelle is known as the “suicide bag” of the cell?', o: ['Lysosome', 'Peroxisome', 'Vacuole', 'Centrosome'], a: 0, x: 'Lysosomes are full of hydrolytic enzymes. If they burst, the enzymes digest the cell’s own contents.' },
    { id: 'cel5', d: 'medium', q: 'The ribosomes of prokaryotic cells are of the', o: ['60S type', '70S type', '80S type', '90S type'], a: 1, x: 'Prokaryotes have 70S ribosomes (50S + 30S subunits). The cytoplasm of eukaryotes has 80S ribosomes (60S + 40S).' },
    { id: 'cel6', d: 'medium', q: 'The fluid mosaic model of the plasma membrane was proposed by', o: ['Schleiden and Schwann', 'Singer and Nicolson', 'Robertson', 'Danielli and Davson'], a: 1, x: 'Singer and Nicolson (1972) described the membrane as a fluid lipid bilayer with proteins embedded in it like a mosaic.' },
    { id: 'cel7', d: 'hard',   q: 'Which of these is NOT found in a prokaryotic cell?', o: ['70S ribosomes', 'Circular DNA', 'Membrane-bound nucleus', 'Cell membrane'], a: 2, x: 'Prokaryotes have no nuclear membrane; their DNA lies free in a region called the nucleoid.' },
    { id: 'cel8', d: 'hard',   q: 'Apart from mitochondria, which organelle has its own DNA and 70S ribosomes?', o: ['Golgi apparatus', 'Chloroplast', 'Lysosome', 'Endoplasmic reticulum'], a: 1, x: 'Mitochondria and chloroplasts are semi-autonomous: each has circular DNA and 70S ribosomes and makes some of its own proteins.' }
  ],

  /* ── Biology: Biological Classification ── */
  cls: [
    { id: 'cls1', d: 'easy',   q: 'The five-kingdom classification was proposed by', o: ['Carolus Linnaeus', 'R.H. Whittaker', 'Ernst Haeckel', 'Aristotle'], a: 1, x: 'R.H. Whittaker (1969) proposed five kingdoms: Monera, Protista, Fungi, Plantae and Animalia.' },
    { id: 'cls2', d: 'easy',   q: 'Bacteria are placed in the kingdom', o: ['Protista', 'Monera', 'Fungi', 'Plantae'], a: 1, x: 'Kingdom Monera contains all prokaryotes, including bacteria and cyanobacteria.' },
    { id: 'cls3', d: 'easy',   q: 'The cell wall of fungi is made mainly of', o: ['cellulose', 'chitin', 'peptidoglycan', 'pectin'], a: 1, x: 'Fungal cell walls contain chitin and other polysaccharides. Cellulose is found in plants and peptidoglycan in bacteria.' },
    { id: 'cls4', d: 'medium', q: 'Mycoplasma are unusual among bacteria because they completely lack a', o: ['cell wall', 'cell membrane', 'ribosome', 'genetic material'], a: 0, x: 'Mycoplasma have no cell wall at all. They are the smallest living cells known and can survive without oxygen.' },
    { id: 'cls5', d: 'medium', q: 'Lichens are symbiotic associations between', o: ['algae and fungi', 'bacteria and fungi', 'algae and bacteria', 'fungi and the roots of plants'], a: 0, x: 'In a lichen the algal partner (phycobiont) makes food and the fungal partner (mycobiont) gives shelter and absorbs water and minerals. Fungi with roots form mycorrhiza.' },
    { id: 'cls6', d: 'medium', q: 'Unicellular eukaryotes are placed in the kingdom', o: ['Monera', 'Protista', 'Fungi', 'Animalia'], a: 1, x: 'Kingdom Protista includes all single-celled eukaryotes, such as Amoeba, Paramecium, Euglena and diatoms.' },
    { id: 'cls7', d: 'hard',   q: 'Who showed that viruses could be crystallised?', o: ['D.J. Ivanowsky', 'M.W. Beijerinck', 'W.M. Stanley', 'Louis Pasteur'], a: 2, x: 'W.M. Stanley (1935) crystallised the tobacco mosaic virus. Ivanowsky first recognised the infectious agent; Beijerinck called it “contagium vivum fluidum”.' },
    { id: 'cls8', d: 'hard',   q: 'Viroids differ from viruses in that they lack', o: ['a protein coat', 'nucleic acid', 'the ability to infect', 'RNA'], a: 0, x: 'Viroids, discovered by T.O. Diener (1971), are free infectious RNA with no protein coat.' }
  ],

  /* ── NMMS Bihar · English alphabet · Mark 1 (Hindi) ── */
  nmab1: [
    { id: 'nmab1_01', d: 'easy', q: 'अंग्रेज़ी वर्णमाला में अक्षर M किस स्थान पर है?', o: ['13', '14', '15', '16'], a: 0, x: 'शॉर्टकट <b>EJOTY</b> याद रखो: E=5, J=10, O=15, T=20, Y=25। J=10 से आगे गिनो: K=11, L=12, <b>M=13</b>।' },
    { id: 'nmab1_02', d: 'easy', q: 'अंग्रेज़ी वर्णमाला का 20वाँ अक्षर कौन-सा है?', o: ['U', 'T', 'W', 'V'], a: 1, x: 'EJOTY में चौथा अक्षर T है, और T=20। इसलिए 20वाँ अक्षर <b>T</b> है।' },
    { id: 'nmab1_03', d: 'easy', q: 'अंग्रेज़ी वर्णमाला में अक्षर P का स्थान क्या है?', o: ['13', '14', '15', '16'], a: 3, x: 'O=15 (EJOTY), तो उसके ठीक बाद वाला P = <b>16</b>।' },
    { id: 'nmab1_04', d: 'easy', q: 'EJOTY शॉर्टकट के अनुसार अक्षर Y का स्थान क्या है?', o: ['23', '24', '25', '26'], a: 2, x: 'E, J, O, T, Y — हर अगला अक्षर 5 आगे: 5, 10, 15, 20, <b>25</b>। Z=26 याद रखो, Y उससे एक पहले है।' },
    { id: 'nmab1_05', d: 'medium', q: 'उल्टे क्रम में गिनें (Z=1, Y=2 …), तो अक्षर D का स्थान क्या होगा?', o: ['20', '21', '22', '23'], a: 3, x: 'उल्टा स्थान = 27 − सीधा स्थान। D=4, इसलिए 27 − 4 = <b>23</b>। यह 27 वाला नियम हर अक्षर पर लगता है।' },
    { id: 'nmab1_06', d: 'medium', q: 'उल्टे क्रम में (Z से शुरू करके) 10वाँ अक्षर कौन-सा है?', o: ['P', 'J', 'R', 'Q'], a: 3, x: '27 − 10 = 17, और 17वाँ अक्षर <b>Q</b> है। जाँच: Z, Y, X, W, V, U, T, S, R, Q — दसवाँ Q।' },
    { id: 'nmab1_07', d: 'medium', q: 'किस अक्षर के साथ H का \'विपरीत जोड़ा\' बनता है? (विपरीत जोड़े के स्थानों का योग 27 होता है)', o: ['Q', 'S', 'P', 'R'], a: 1, x: 'H=8, तो विपरीत अक्षर = 27 − 8 = 19 = <b>S</b>। जैसे A–Z, B–Y वैसे ही H–S।' },
    { id: 'nmab1_08', d: 'medium', q: 'इनमें से कौन-सा जोड़ा विपरीत अक्षरों का है?', o: ['KO', 'HR', 'GS', 'FU'], a: 3, x: 'विपरीत जोड़े का योग 27 होता है। F=6, U=21, कुल 27 ✓। बाकी: GS = 7+19 = 26, HR = 8+18 = 26, KO = 11+15 = 26। उत्तर <b>FU</b>।' },
    { id: 'nmab1_09', d: 'easy', q: 'वर्णमाला में L और Q के बीच कितने अक्षर हैं?', o: ['4', '5', '6', '7'], a: 0, x: 'L=12, Q=17। बीच के अक्षर = 17 − 12 − 1 = <b>4</b> (M, N, O, P)। दोनों सिरों को मत गिनो।' },
    { id: 'nmab1_10', d: 'medium', q: 'अंग्रेज़ी वर्णमाला में बाएँ से 8वें अक्षर के दाईं ओर 5वाँ अक्षर कौन-सा है?', o: ['K', 'M', 'J', 'L'], a: 1, x: 'बाएँ से 8वाँ = H। दाएँ जाने पर स्थान जुड़ता है: 8 + 5 = 13 = <b>M</b>।' },
    { id: 'nmab1_11', d: 'medium', q: 'अंग्रेज़ी वर्णमाला में दाएँ से 6वाँ अक्षर कौन-सा है?', o: ['U', 'T', 'S', 'V'], a: 0, x: 'दाएँ से गिनना = उल्टा क्रम। 27 − 6 = 21 = <b>U</b>।' },
    { id: 'nmab1_12', d: 'medium', q: 'अक्षर D और J के ठीक बीच में कौन-सा अक्षर है?', o: ['H', 'F', 'E', 'G'], a: 3, x: 'D=4, J=10। बीच का स्थान = (4 + 10) ÷ 2 = 7 = <b>G</b>। जाँच: D-E-F-<b>G</b>-H-I-J, दोनों ओर 2-2 अक्षर।' },
    { id: 'nmab1_13', d: 'easy', q: 'अंग्रेज़ी वर्णमाला में कितने स्वर (vowels) हैं?', o: ['4', '5', '6', '7'], a: 1, x: 'स्वर हैं A, E, I, O, U — कुल <b>5</b>। बाकी 21 व्यंजन हैं।' },
    { id: 'nmab1_14', d: 'easy', q: 'इनमें से कौन-सा अक्षर स्वर (vowel) नहीं है?', o: ['A', 'W', 'I', 'O'], a: 1, x: 'स्वर केवल A, E, I, O, U हैं। <b>W</b> व्यंजन है।' },
    { id: 'nmab1_15', d: 'easy', q: 'अगर A=1, B=2, C=3 …, तो शब्द CAB के अक्षरों का योग कितना है?', o: ['6', '7', '8', '9'], a: 0, x: 'C=3, A=1, B=2। योग = 3 + 1 + 2 = <b>6</b>।' },
    { id: 'nmab1_16', d: 'medium', q: 'अगर A=1, B=2 …, तो शब्द DOG के अक्षरों का योग कितना है?', o: ['25', '26', '27', '28'], a: 1, x: 'D=4, O=15 (EJOTY), G=7। योग = 4 + 15 + 7 = <b>26</b>।' },
    { id: 'nmab1_17', d: 'easy', q: 'स्थान 9 और 14 वाले अक्षर, इसी क्रम में लिखने पर कौन-सा अक्षर-जोड़ा बनता है?', o: ['HM', 'IN', 'IO', 'JN'], a: 1, x: '9वाँ अक्षर I है (J=10 से एक पहले), 14वाँ N है (O=15 से एक पहले)। शब्द बना <b>IN</b>।' },
    { id: 'nmab1_18', d: 'easy', q: 'अक्षर R से 4 अक्षर आगे कौन-सा अक्षर है?', o: ['W', 'U', 'X', 'V'], a: 3, x: 'R=18, आगे जाने पर जोड़ो: 18 + 4 = 22 = <b>V</b>।' },
