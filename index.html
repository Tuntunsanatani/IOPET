/* An account's progress is wiped everywhere (cloud and every phone), so the owner proves it is him: the password is checked
   by the server, as for "Delete account". A guest has no password; his progress lives on this phone only. */
ACTIONS['reset-yes'] = function () {
  var a = db.auth, gen = authGen, pw;
  function wipe() { resetProgress(user); S = null; save(); hideModal(); repaint(); toast('Progress reset.'); }
  if (user.guest || !a) return wipe();
  pw = rawVal('m-pass');
  if (!pw) return modalErr('Enter your password to confirm.');
  busy('Checking your password…');
  idp('signInWithPassword', { email: a.email, password: pw, returnSecureToken: true }, function (err, j) {
    idle();
    if (gen !== authGen || !user || !db.auth) return;
    if (err || !goodLogin(j) || j.localId !== a.uid) return modalErr(WRONG_LOGIN[err] ? 'Password is incorrect.' : authMsg(err || 'BAD_RESPONSE'));
    wipe();
  });
};
ACTIONS['delete-ask'] = function () {
  if (user.guest || !db.auth) {
    confirmModal({ emoji: '❌', title: 'Delete guest data?', text: 'The guest progress is removed from this device. This cannot be undone.', yes: 'Delete', act: 'delete-yes', danger: true });
    return;
  }
  showModal('<div class="m-emoji">❌</div><div class="m-title center">Delete this account?</div>' +
    '<div class="m-text">Your login, your cloud backup and the data on this phone are deleted for ever. Nobody can bring them back. Enter your password to confirm.</div>' +
    passField('m-pass', 'Password', 'current-password', false) +
    '<div class="m-err" id="m-err" role="alert"></div>' +
    '<div class="m-actions"><button class="btn btn-sec" data-act="modal-close">Cancel</button><button class="btn btn-danger" data-act="delete-yes">Delete for ever</button></div>', 'delete-yes');
};
/* Order matters: 1) prove it is the owner (password); 2) replace the cloud record by an empty "being deleted" marker,
   so that no other phone can write there any more; 3) delete the login; 4) wipe the phone.
   The marker stays for good: it holds no data, and as long as it is there no late upload from another phone can bring the
   record back. If a step fails, nothing after it runs — data can never be left behind without a login that could remove it. */
ACTIONS['delete-yes'] = function () {
  var a = db.auth, gen = authGen, pw, uid;
  if (user.guest || !a) {
    delete db.users.guest;
    db.session = null; user = null; S = null; saveSignedOut(); applyPrefs(); hideModal();
    reset('login'); toast('Guest data deleted from this device.');
    return;
  }
  pw = rawVal('m-pass'); uid = a.uid;
  if (!pw) return modalErr('Enter your password to confirm.');
  if (sync.busy) return modalErr('A backup is running. Try again in a few seconds.');
  busy('Deleting your account…');
  sync.frozen = true; clearTimeout(sync.timer);                // no backup may start while this runs
  function fail(msg) { sync.frozen = false; idle(); modalErr(msg); }
  function gone() {                                            // the login no longer exists
    endSession(); dropLocal(uid);
    db.auth = null; db.session = null; user = null; S = null; delTried = '';
    saveSignedOut(); applyPrefs(); idle(); hideModal();
    reset('login'); toast('Account deleted.');
  }
  idp('signInWithPassword', { email: a.email, password: pw, returnSecureToken: true }, function (err, j) {
    var marker;
    if (gen !== authGen) { idle(); return; }
    if (WRONG_LOGIN[err] && delTried === uid && a.it) {        // an earlier try may have removed the login although its answer was lost
      return idp('lookup', { idToken: a.it }, function (e0) {
        if (gen !== authGen) { idle(); return; }
        if (e0 === 'USER_NOT_FOUND') gone(); else fail('Password is incorrect.');
      });
    }
    if (err || !goodLogin(j) || j.localId !== uid) return fail(WRONG_LOGIN[err] ? 'Password is incorrect.' : authMsg(err || 'BAD_RESPONSE'));
    marker = (jwtPayload(j.idToken) || {}).email_verified === true;      // only a confirmed account can have a cloud record
    function step2(st) {
      if (gen !== authGen) { idle(); return; }
      if (st === 'offline') { syncUnknown(uid); syncSoon(20000); }                  // no answer: the marker may or may not be in place.
      if (st !== 'ok') return fail(st === 'offline' ? AUTH_MSG.NETWORK              // So forget what the cloud copy looked like: the next
        : 'Your cloud backup could not be deleted (' + st + '), so the account was not deleted. Try again.');   // backup looks first, and repairs it
      delTried = uid;
      idp('delete', { idToken: j.idToken }, function (e2) {
        if (gen !== authGen) { idle(); return; }
        if (e2 && e2 !== 'USER_NOT_FOUND') {                   // the login is probably still there. The marker stays all the same: the server may
          syncUnknown(uid);                                    // have removed the login and only failed to say so. An account that is still
          fail(e2 === 'NETWORK' ? 'The connection dropped at the last step. Check the internet and try again.'   // alive takes its record back by itself (see syncRun)
            : 'Your cloud backup is deleted, but the login could not be removed (' + e2 + '). Try again. If you leave it, the backup is made again by itself in a few minutes.');
          syncSoon(20000);
          return;
        }
        gone();                                                // the empty marker stays (see above)
      });
    }
    if (marker) fsPut(j.idToken, uid, fsTomb(), null, step2); else fsDelete(j.idToken, uid, step2);
  });
};

/* ── help ── */
ACTIONS.faq = function (el) {
  var item = el.parentNode, open;
  if (!item || !item.classList) return;
  open = item.classList.toggle('open');
  el.setAttribute('aria-expanded', open ? 'true' : 'false');
};
ACTIONS.feedback = function () {
  showModal('<div class="m-title">Send feedback</div><div class="m-text">Found a bug or want a feature? Write it here.</div>' +
    '<textarea class="ta" id="m-fb" maxlength="1000" placeholder="Type your message" aria-label="Feedback message"></textarea>' +
    '<div class="m-err" id="m-err" role="alert"></div>' +
    '<div class="m-actions"><button class="btn btn-sec" data-act="modal-close">Cancel</button><button class="btn btn-primary" data-act="feedback-send">Send</button></div>');
};
ACTIONS['feedback-send'] = function () {
  var text = val('m-fb').slice(0, 1000), msg;
  if (text.length < 5) return modalErr('Write a few words first.');
  user.feedback.push({ t: Date.now(), text: text });
  if (user.feedback.length > 20) user.feedback = user.feedback.slice(-20);
  save(); repaint();
  msg = 'IOPET feedback (v' + CONFIG.VERSION + ')\n\n' + text;
  if (CONFIG.SUPPORT_EMAIL) {
    toast('Opening your mail app…');
    window.location.href = 'mailto:' + CONFIG.SUPPORT_EMAIL + '?subject=' + encodeURIComponent('IOPET feedback') + '&body=' + encodeURIComponent(msg);
    return;
  }
  if (navigator.share) {
    try {
      navigator.share({ title: 'IOPET feedback', text: msg }).then(function () { toast('Thanks for the feedback!'); }, function () { toast('Feedback saved on this device.'); });
      return;
    } catch (e) { /* fall through to copy */ }
  }
  copyText(msg, function (ok) { toast(ok ? 'Saved and copied. Paste it in WhatsApp or email to send it.' : 'Feedback saved on this device.'); });
};
function reportsText() {
  return user.reports.map(function (r) {
    var q = findQuestion(r.q);
    return r.q + ' — ' + r.r + ' (' + fmtShort(r.t) + ')' + (q ? '\n' + figPlain(q.q) : '');
  }).join('\n\n');
}
ACTIONS.reports = function () {
  var list = user.reports.slice().reverse(), html;
  if (!list.length) {
    showModal('<div class="m-emoji">🚩</div><div class="m-title center">No reports yet</div><div class="m-text center">While practicing, tap “Report a problem with this question” under the explanation.</div>' +
      '<div class="m-actions"><button class="btn btn-primary" data-act="modal-close">OK</button></div>');
    return;
  }
  html = '<div class="m-title">Reported questions</div><div class="m-list">';
  list.forEach(function (r) {
    var q = findQuestion(r.q), text = q ? figPlain(q.q) : 'Question ' + esc(r.q);
    html += '<div class="m-list-item"><b>' + esc(r.r) + ' · ' + fmtShort(r.t) + '</b>' + (text.length > 90 ? text.slice(0, 90) + '…' : text) + '</div>';
  });
  showModal(html + '</div><div class="m-actions"><button class="btn btn-sec" data-act="reports-clear">Clear</button><button class="btn btn-primary" data-act="reports-copy">Copy list</button></div>' +
    '<button class="link block" data-act="modal-close">Close</button>');
};
ACTIONS['reports-copy'] = function () {
  copyText('IOPET reported questions\n\n' + reportsText(), function (ok) { toast(ok ? 'Copied. Paste it in WhatsApp or email.' : 'Could not copy on this device.'); });
};
ACTIONS['reports-clear'] = function () { user.reports = []; user.rc = Date.now(); save(); repaint(); toast('Reports cleared.'); };

/* ════════════════════════════════════════════════════════════════════
   EVENTS — one delegated listener each; nothing is bound per screen
   ════════════════════════════════════════════════════════════════════ */
function run(name, el, ev) {
  var fn = ACTIONS[name];
  if (!fn) { if (window.console) console.warn('IOPET: no handler for action "' + name + '"'); return; }
  try { fn(el, ev); }
  catch (err) {
    if (window.console) console.error('IOPET action "' + name + '" failed', err);
    toast('Something went wrong. Please try again.');
  }
}
function onClick(ev) {
  var t = ev.target, el;
  if (t && t.nodeType === 3) t = t.parentNode;
  if (!t) return;
  if (t === elModal) {                                              // tap outside the dialog closes it —
    if (backdropDown && !locked()) hideModal();                     // but only if the press also started outside
    backdropDown = false;                                           // (dragging to select text must not close it)
    return;
  }
  el = upTo(t, 'data-act');
  if (!el || el.disabled) return;
  if (locked() || busyOn) return;                                   // CHANGE #5: navigation lock; nothing is tappable during a network step
  if (/(^| )(btn-primary|ch-card|topic-card-btn|seg-btn|opt-btn)( |$)/.test(el.className) && !/(^| )btn-check( |$)/.test(el.className)) feel('tap');   // (CHECK has its own rhythm: right or wrong)   // the big buttons answer the finger (an answer has its own rhythm)
  run(el.getAttribute('data-act'), el, ev);
}
function onInput(ev) {
  var t = ev.target, kind = t && t.getAttribute ? t.getAttribute('data-in') : null, s, bar, txt;
  if (kind !== 'pass-new') return;
  s = passStrength(t.value); bar = $('st-bar'); txt = $('st-txt');
  if (bar) { bar.style.width = s.w + '%'; bar.style.backgroundColor = s.c; }
  if (txt) txt.textContent = s.t;
}
function onKeyDown(ev) {
  var t = ev.target, key = ev.key, code = ev.keyCode, host;
  if (!t || !t.tagName) return;
  if ((key === 'Enter' || code === 13) && t.tagName === 'INPUT') {
    host = upTo(t, 'data-enter');
    if (host) { ev.preventDefault(); if (!locked() && !busyOn) run(host.getAttribute('data-enter'), host, ev); }
  }
}
/* The app is open in another tab and that tab just saved. Follow a sign-in / sign-out made there, and
   join its copy of the progress with this one, so neither tab can overwrite the other with old data. */
function onStorage(ev) {
  var fresh, mine, theirs, same, k;
  if (ev.key !== Store.KEY) return;
  fresh = normalizeDb(Store.load());
  same = (fresh.auth ? fresh.auth.uid : '') === (db.auth ? db.auth.uid : '') && fresh.session === db.session;
  if (!same) {                                                 // followed at once, even in the middle of a "please wait" step:
    endSession(); S = null; db = fresh;                        // a sign-out made in the other tab must never be undone by this one
    user = db.session && has(db.users, db.session) ? db.users[db.session] : null;
    applyPrefs(); idle(); hideModal();
    reset(user ? 'home' : 'login');
    if (user && user.np && syncAllowed()) syncSoon(1500);      // the other tab may be closed before the backup has come: this one fetches it too
    return;
  }
  /* Same login: join the two copies now, also in the middle of a "please wait" step — this tab may be about to save,
     and what it saves must not be older than what the other tab has just stored. (Nothing is repainted while waiting.) */
  mine = user;
  theirs = mine && has(fresh.users, mine.id) ? fresh.users[mine.id] : null;
  k = mine ? stable(mine) + (db.auth ? db.auth.verified : '') : '';
  if (mine && theirs) {
    applyMerged(mine, mergeProfile(mine, theirs, false));
    mine.quote = theirs.quote; mine.tip = theirs.tip;          // not part of the merge: the tab that saved last decides,
    if (!theirs.np) delete mine.np;                            // otherwise two tabs would keep correcting each other for ever
  }
  if (db.auth && fresh.auth && fresh.auth.exp >= db.auth.exp) db.auth = fresh.auth;
  if (mine && stable(mine) + (db.auth ? db.auth.verified : '') !== k) { applyPrefs(); softRefresh(); }
  for (k in fresh.users) if (has(fresh.users, k) && !(mine && k === mine.id)) db.users[k] = fresh.users[k];
  for (k in db.users) if (has(db.users, k) && !has(fresh.users, k) && !(mine && k === mine.id)) delete db.users[k];
  for (k in fresh.sync) {                                            // the later record of each backup is kept; of two of the same moment, the one
    if (has(fresh.sync, k) && (!has(db.sync, k) || fresh.sync[k].at > db.sync[k].at ||       // that knows when the cloud copy was written (an older
        (fresh.sync[k].at === db.sync[k].at && (fresh.sync[k][REC_UT] || !db.sync[k][REC_UT])))) db.sync[k] = fresh.sync[k];   // app in another tab stores it without)
  }
  if (!fresh.note) db.note = '';
  paintSync();                                                       // the other tab may have backed up (or found the backup gone)
  if (mine && mine.np && syncAllowed() && !sync.busy && !sync.timer && !(sync.err && !has(SYNC_RETRY_MS, sync.err))) syncSoon(1500);   // nobody is fetching the backup this tab waits for
  if (stable(db) !== stable(fresh) && echoOk()) saveLocal();         // only when this tab knew something the other did not
}
/* Safety net for the line above: at most 8 answers to another tab's save in 5 seconds, whatever the two copies look like. */
function echoOk() {
  var t = window.performance.now();
  storageEcho = storageEcho.filter(function (x) { return t - x < 5000; });
  if (storageEcho.length >= 8) return false;
  storageEcho.push(t);
  return true;
}

/* Phone back button. One "trap" history entry is added on the first tap; when Back pops it,
   the app handles the press itself and steps forward onto the trap again. Nothing here is
   required for the app to work — if the History API is blocked, in-app buttons still do everything. */
var backdropDown = false;
var hist = { ok: true, armed: false };
function armBack() {
  if (!hist.ok || hist.armed) return;
  try { window.history.pushState({ iopetTrap: 1 }, ''); hist.armed = true; } catch (e) { hist.ok = false; }
}
function onPopState(ev) {
  var st = ev.state;
  if (st && st.iopetTrap) { hist.armed = true; return; }
  if (!hist.armed) return;
  hist.armed = false;
  if (appBack()) { try { window.history.forward(); } catch (e) { /* stays unarmed until the next tap */ } }
  else toast('Press back again to exit');
}

/* After the splash: open where the user left off, then catch up with the cloud in the background. */
/* THE INSTALLED APP (3.7.1): on its web address the app registers its small helper, sw.js (next to the page), which lets it open
   without internet and brings each new version at the next opening. Opened as a file, inside a frame that may not, or on a browser
   without the feature, nothing happens and the app runs exactly as before. */
function registerHelper() {
  var ok = false;
  try { ok = location.protocol === 'https:' || (location.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)); } catch (e) { ok = false; }
  if (!ok) return;
  try {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker) return;
    navigator.serviceWorker.register('sw.js').then(null, function () { /* not this time: the app still works as a page */ });
  } catch (e) { /* a frame that may not have one */ }
}
function enterApp() {
  var note = db.note;
  if (db.session && has(db.users, db.session)) {
    user = db.users[db.session]; applyPrefs(); reset('home');
    if (db.auth) { if (db.auth.verified) syncRun(true); else autoVerify(); }
  } else reset('login');
  if (user && user.settings.calm && !user.flags.calmnote && !note) {      // told once: the opening logo now plays even with "Reduce animations" on
    user.flags.calmnote = 1; save();
    toast('The opening logo animation now always plays. “Reduce animations” still turns off the other screen effects.');
  }
  if (note) {
    db.note = ''; saveLocal();
    toast(user ? 'Sign-in is now by email. Your progress is kept in guest mode.' : 'Sign-in is now by email. Your earlier progress is under “Continue as guest”.');
  }
}
function boot() {
  elPhone = $('phone'); elScreens = $('screens'); elNav = $('nav'); elModal = $('modal'); elToast = $('toast'); elBusy = $('busy');
  elPhone.setAttribute('data-net', '0');
  try { if (window.history.state && window.history.state.iopetTrap) hist.armed = true; } catch (e) { hist.ok = false; }
  document.addEventListener('click', armBack, true);
  window.addEventListener('popstate', onPopState);
  window.addEventListener('storage', onStorage);
  window.addEventListener('online', function () { if (syncAllowed()) syncSoon(1000); autoVerify(); });
  elModal.addEventListener('mousedown', function (ev) { backdropDown = ev.target === elModal; });
  elModal.addEventListener('touchstart', function (ev) { backdropDown = ev.target === elModal; });
  elPhone.addEventListener('click', onClick);
  elPhone.addEventListener('input', onInput);
  elPhone.addEventListener('keydown', onKeyDown);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' || ev.key === 'Esc' || ev.keyCode === 27) { if (appBack()) ev.preventDefault(); }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (S && !S.done && S.tick0) { S.elapsed += Date.now() - S.tick0; S.tick0 = 0; }
      stopTimer();
      if (!sync.busy && syncDirty()) syncRun(false);                  // leaving the app: back up what is new
    } else if (stack.length) {
      if (top().s === 'practice' && S && !S.done) startTimer();
      else if (user && TABS[top().s] && !modalOpen && !busyOn) repaint();       // refresh streak / day after midnight
      autoVerify();                                                   // coming back from the mail app after tapping the link
      if (syncAllowed() && !sync.busy && window.performance.now() - sync.last > 60000 && (!syncRec(user.id) || Date.now() - syncRec(user.id).at > 600000)) syncRun(true);
    }
  });

  applyTheme(); watchTheme();                                       // light or dark before anything is drawn
  setTimeout(registerHelper, CONFIG.SPLASH_MS + 1500);              // (after the first screens: they come first)
  if (db.session && has(db.users, db.session) && db.users[db.session].settings.calm) elPhone.classList.add('calm');   // "Reduce animations": no screen fades (the logo itself still lights up)
  stack = [{ s: 'splash' }];
  paint();
  setTimeout(function () {
    if (!stack.length || top().s !== 'splash') return;
    enterApp();
  }, CONFIG.SPLASH_MS);
}
boot();

})();
</script>
